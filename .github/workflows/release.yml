name: release
# Push a tag like v0.3.0 to build the Windows installer and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pytest
      - run: python -m pytest -q tests
      - run: pyinstaller --noconfirm packaging/brewbench.spec
      - name: Installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\installer.iss
          # a fixed name too, so the website can always link to .../releases/latest/download/brewbench-setup.exe
          Copy-Item "dist\brewbench-setup-$v.exe" "dist\brewbench-setup.exe"
      # Signing: see docs/RELEASING.md (SignPath Foundation for the installer; the Store signs the MSIX itself).
      - name: "MSIX for the Microsoft Store (unsigned, the Store signs it)"
        if: ${{ vars.STORE_PACKAGE_NAME != '' }}
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $m = Get-Content packaging\msix\AppxManifest.xml -Raw
          $m = $m.Replace("PARTNER_CENTER_PACKAGE_NAME", "${{ vars.STORE_PACKAGE_NAME }}").Replace("PARTNER_CENTER_PUBLISHER_DISPLAY_NAME", "${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}").Replace("PARTNER_CENTER_PUBLISHER", "${{ vars.STORE_PUBLISHER }}").Replace("APP_VERSION", $v)
          Set-Content dist\brewbench\AppxManifest.xml $m
          New-Item -ItemType Directory -Force dist\brewbench\Assets | Out-Null
          Copy-Item packaging\msix\Assets\* dist\brewbench\Assets\ -ErrorAction SilentlyContinue
          $mk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          & $mk.FullName pack /d dist\brewbench /p "dist\brewbench-$v.msix" /o
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/brewbench-setup-*.exe
            dist/brewbench-setup.exe
            dist/brewbench-*.msix
          generate_release_notes: true
