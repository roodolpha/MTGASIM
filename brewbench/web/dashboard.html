<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brewbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Brewbench app: same flat, data-first system as the website */
:root{--bg:#0B0C0E;--s1:#111317;--s2:#161920;--panel:#111317;--line:#22262D;--line2:#2C313A;--text:#E6E8EB;--dim:#8A919B;--faint:#5C636D;
--hot:#FF6B3D;--sim:#6CB6FF;--win:#3FB950;--loss:#F0605A;--r:6px;
--W:#F2E9C9;--U:#3D8BE0;--B:#7A7470;--R:#E5533A;--G:#4CA562}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
a{color:var(--text);text-underline-offset:3px;text-decoration-color:var(--line2)}
a:hover{text-decoration-color:var(--hot)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr.go:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:24px;padding:0 max(24px,calc((100vw - 1240px)/2));height:56px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:17px;letter-spacing:-.02em;color:var(--text);text-decoration:none}
.logo span{color:var(--hot)}
nav{display:flex;gap:2px;height:100%}
nav a{display:flex;align-items:center;padding:0 12px;color:var(--dim);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav a:hover{color:var(--text)}
nav a[aria-current="page"]{color:var(--text);border-bottom-color:var(--hot)}
#job{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
main{max-width:1288px;margin:0 auto;padding:28px 24px 64px;display:flex;flex-direction:column;gap:20px}
main > *{margin:0}
.secthead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1.page{font-size:24px}
.plain{display:flex;flex-direction:column;gap:6px}
.plain p{max-width:760px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:var(--r);border:1px solid var(--hot);background:var(--hot);color:#170A04;font:600 13px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#FF7F57}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--s2);border-color:var(--line2);color:var(--text);font-weight:500}
.btn.ghost:hover{border-color:var(--faint);background:var(--s2)}
.btn.stop{height:28px;padding:0 10px;font-size:12px;background:var(--loss);border-color:var(--loss);color:#1A0606}
.back{all:unset;cursor:pointer;color:var(--dim);font-size:13px;align-self:flex-start}
.back:hover{color:var(--text)}
/* panels */
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h2{font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px;align-items:start}
.empty{padding:28px;text-align:center;color:var(--dim);background:var(--s1);border:1px solid var(--line);border-radius:var(--r)}
.empty h2{color:var(--text);font-size:16px;margin-bottom:6px}
/* stats */
.strip{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--s1)}
.strip > div{padding:12px 16px;border-left:1px solid var(--line);flex:1 1 140px}
.strip > div:first-child{border-left:0}
.strip b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em}
.strip span{color:var(--dim);font-size:12px}
.sim{color:var(--sim)} .dim{color:var(--dim)} .err{color:var(--loss)}
.wr{font-size:22px;font-weight:600}
.pips{display:inline-flex;gap:3px;vertical-align:-1px}
.pip{width:9px;height:9px;border-radius:50%;display:inline-block}
/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--dim);text-align:left;font-weight:500;padding:8px 10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td .sub{display:block;font-size:12px;color:var(--dim)}
tr.go{cursor:pointer} tr.go:hover td{background:var(--s2)}
.bar{height:6px;background:#1E2229;border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--sim)}
.bar i.bad{background:var(--loss)}
/* deck cards: small framed art */
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--line2)}
.card button.open{all:unset;cursor:pointer;display:flex;flex-direction:column;height:100%}
.art{height:96px;background:var(--s2) center 25%/cover no-repeat;position:relative;border-bottom:1px solid var(--line)}
.art .tag,.art .pos{position:absolute;left:8px;top:8px;background:rgba(11,12,14,.85);padding:1px 7px;border-radius:4px;font-size:11px;font-weight:500;color:var(--text)}
.art .tag.r{left:auto;right:8px}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{display:flex;gap:18px}
.nums small{display:block;font-size:11px;color:var(--dim)}
.nums b{font-size:18px;font-weight:600}
.card .body .btn{height:28px;padding:0 9px;font-size:12px}
.card .body > div:last-child{gap:6px!important}
/* tabs: underline */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;color:var(--dim);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--hot)}
.tabs button:focus-visible{outline:2px solid var(--hot);outline-offset:-2px}
/* forms */
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);color:var(--text);font:14px Inter,system-ui,sans-serif;padding:0 10px;height:34px}
textarea{height:auto;min-height:180px;padding:8px 10px;font:12px/1.5 ui-monospace,Consolas,monospace}
input[type=checkbox]{height:auto;accent-color:var(--hot)}
.form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
details summary{cursor:pointer}
code{font:12px ui-monospace,Consolas,monospace;background:var(--s2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
pre{border:1px solid var(--line)}
/* page header with a small framed art (replaces the old banners) */
.hero{display:flex;gap:18px;align-items:center;background:none!important;padding:0}
.hero .in{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero .kick{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.hero h1{font-size:24px}
.hero p{margin:0;color:var(--dim);max-width:760px}
.hero .hstats{display:flex;gap:24px;flex-wrap:wrap;margin-top:6px}
.hero .hstats b{font-size:20px;font-weight:600}
.hero .hstats span{color:var(--dim);font-size:12px;margin-left:4px}
.hero .ha{width:132px;height:96px;flex:none;border-radius:4px;border:1px solid var(--line2);background:var(--s2) center 25%/cover no-repeat}
/* setup checklist */
.check{display:flex;gap:14px;align-items:flex-start}
.check .mark{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;border:1px solid var(--line2);color:var(--dim)}
.check .mark.ok{background:var(--win);border-color:var(--win);color:#06140A}
.check h3{font-size:15px}
.check p{margin:0 0 8px;color:var(--dim)}
.check p b{color:var(--text)}
/* banners */
.updbar{max-width:1240px;margin:16px auto 0;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--line2);border-left:3px solid var(--hot);border-radius:var(--r);padding:10px 14px;width:calc(100% - 48px)}
#runbanner{border-left:3px solid var(--loss)!important;border-color:var(--line)}
@media (max-width:760px){#job{display:none}.hero .ha{display:none}}
</style>
</head>
<body>
<header>
<a class="logo" href="/tracker">brew<span>bench</span></a>
<nav aria-label="Main">
<a href="/tracker">My games</a>
<a href="#runs" data-view="runs">Sims</a>
<a href="#decks" data-view="decks">Decks</a>
<a href="#optimiser" data-view="optimiser">Optimiser</a>
<a href="#settings" data-view="settings">Settings</a>
</nav>
<div id="job" aria-live="polite"></div>
</header>
<main id="main"></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => x == null ? '–' : (100 * x).toFixed(1) + '%';
const art = name => name ? 'https://api.scryfall.com/cards/named?format=image&version=art_crop&exact=' + encodeURIComponent(name) : '';
const api = (p, body) => fetch(p, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {}).then(r => r.json());
let STATUS = {formats: []}, DECKS = [];

const VIEWS = () => ({runs, decks, optimiser, new: newRun, run: runPage, settings, setup, swap: swapPage});
function show(view, arg) {
  const h = arg ? '#' + view + '/' + encodeURIComponent(arg) : '#' + view;
  if (location.hash !== h) history.replaceState(null, '', h);
  const tab = view === 'run' ? 'runs' : view;
  document.querySelectorAll('nav a[data-view]').forEach(a => a.dataset.view === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  window.scrollTo(0, 0);
  VIEWS()[view](arg);
}
function route() {
  const [v, a] = location.hash.slice(1).split('/');
  if (v && VIEWS()[v]) { show(v, a && decodeURIComponent(a)); return true; }
  return false;
}
window.addEventListener('hashchange', route);
const hero = (img, inner, cls = '') => `<section class="hero ${cls}">${img ? `<div class="ha" style="background-image:url('${esc(img)}')"></div>` : ''}<div class="in">${inner}</div></section>`;
let FMT = '';

function deckArt(d) {
  const deck = DECKS.find(x => x.id === (d || '').replace(/\.dck$/, ''));
  if (deck && deck.commanders && deck.commanders.length) return deck.commanders[0];
  if (deck) { const m = deck.list.split('\n').find(l => /^\d+ /.test(l) && !/Plains|Island|Swamp|Mountain|Forest/.test(l)); return m ? m.replace(/^\d+ /, '') : ''; }
  return '';
}

async function runs() {
  const all = await api('/api/runs');
  const head = `<div class="plain"><div class="secthead" style="margin:0"><h1 class="page">Sims</h1><span style="display:flex;gap:8px"><a class="btn ghost" href="#swap">Test a change</a><a class="btn" href="#new">New run</a></span></div>`;
  if (!all.length) { $('#main').innerHTML = head + `<p class="dim" style="margin:0">Nothing simulated yet. Add a deck, then start a run and leave it going.</p></div>`; return; }
  const games = all.reduce((n, r) => n + ((r.summary || {}).games || 0), 0);
  const best = all.filter(r => (r.summary || {}).games >= 50).sort((x, y) => y.summary.win_rate - x.summary.win_rate)[0];
  $('#main').innerHTML = head + `<div id="runbanner" class="panel" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap" hidden><b>A sim is running.</b><span class="dim">It keeps your PC busy until it finishes. Games already played are kept.</span><button class="btn stop" style="margin-left:auto" id="bstop">Stop all sims</button></div><div class="strip"><div><b>${all.length}</b><span>runs</span></div><div><b>${games.toLocaleString()}</b><span>games simmed</span></div>${best ? `<div><b class="sim">${pct(best.summary.win_rate)}</b><span>best: ${esc(best.label)}</span></div>` : ''}</div></div>
  <div class="panel"><table><thead><tr><th>Deck</th><th>Format</th><th class="n">Win rate</th><th class="n">Games</th><th class="n">Opponents</th><th class="n">Date</th></tr></thead><tbody>
  ${all.map(r => { const s = r.summary || {}; const ci = s.ci95 && s.games ? `${pct(s.ci95[0])}–${pct(s.ci95[1])}` : '';
    return `<tr class="go" data-run="${esc(r.run)}" tabindex="0"><td><b>${esc(r.label)}</b></td><td class="dim">${esc(r.format)}</td>
    <td class="n"><b class="sim">${pct(s.win_rate)}</b>${ci ? `<span class="sub">${ci}</span>` : ''}</td><td class="n">${s.games || 0}</td><td class="n dim">${r.opponents.length}</td><td class="n dim">${new Date(r.started * 1000).toLocaleDateString()}</td></tr>`; }).join('')}
  </tbody></table></div>`;
  const bs = $('#bstop'); if (bs) bs.onclick = () => stopAll(bs);
  $('#runbanner').hidden = !simming().any;
  document.querySelectorAll('[data-run]').forEach(t => { t.onclick = () => show('run', t.dataset.run); t.onkeydown = e => { if (e.key === 'Enter') show('run', t.dataset.run); }; });
}

async function runPage(id) {
  const r = await api('/api/runs/' + encodeURIComponent(id));
  const s = r.summary; const deck = (r.deck || '').split(/[\\/]/).pop();
  const lo = s.ci95[0], hi = s.ci95[1];
  $('#main').innerHTML = `<div class="plain"><button class="back">← All sims</button>
  <h1 class="page">${esc(r.label)}</h1><div class="dim">${esc(r.format)} · AI ${esc(r.ai)}</div>
  <div class="strip"><div><b class="sim">${pct(s.win_rate)}</b><span>win rate (likely ${pct(lo)}–${pct(hi)})</span></div>
  <div><b>${s.wins}–${s.losses}${s.draws ? '–' + s.draws : ''}</b><span>${s.games} games</span></div>
  <div><b>${pct(s.on_play)}</b><span>on the play</span></div><div><b>${pct(s.on_draw)}</b><span>on the draw</span></div>
  ${s.avg_turns ? `<div><b>${Math.round(s.avg_turns / 2)}</b><span>turns a game</span></div>` : ''}</div></div>
  <div class="grid2">
  <div class="panel"><h2 style="margin-bottom:8px">Matchups, worst first</h2>
  <table><thead><tr><th>Opponent</th><th class="n">Won</th><th></th><th class="n">Games</th></tr></thead><tbody>
  ${r.opponents.map(o => `<tr><td>${esc(o.opponent)}</td><td class="n">${pct(o.win_rate)}</td><td><div class="bar"><i class="${o.win_rate < .5 ? 'bad' : ''}" style="width:${Math.round(100 * (o.win_rate || 0))}%"></i></div></td><td class="n dim">${o.games}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="panel"><h2 style="margin-bottom:4px">When this card hit the table…</h2>
  <p class="dim" style="margin:0 0 8px;font-size:13px">Win rate when the card was on the battlefield vs when it wasn't. It's a hint for what to test, not proof: cheap cards land more often.</p>
  <table><thead><tr><th>Card</th><th class="n">Seen</th><th class="n">With</th><th class="n">Without</th></tr></thead><tbody>
  ${r.cards.slice(0, 12).map(c => `<tr><td>${esc(c.card)}</td><td class="n dim">${c.games_seen}</td><td class="n">${pct(c.win_seen)}</td><td class="n dim">${pct(c.win_not_seen)}</td></tr>`).join('') || '<tr><td colspan="4" class="dim">Needs more games.</td></tr>'}
  </tbody></table></div></div>`;
  $('.back').onclick = () => show('runs');
}

let DFMT = '', OPPFMT = '';
// ---- "Did this swap help?": your deck vs an edited copy, on the same shuffles and opponents
async function swapPage(pick) {
  DECKS = await api('/api/decks');
  const sw = await api('/api/swap');
  const running = sw.state === 'running';
  const fmts = (STATUS.formats || []);
  const cur = DECKS.find(d => d.id === pick) || DECKS.slice().sort((a, b) => b.updated - a.updated)[0] || {};
  const changes = (sw.out || []).length || (sw.into || []).length ? `<p class="dim" style="margin:6px 0 0">Out: ${(sw.out || []).map(([n, q]) => esc(q + ' ' + n)).join(', ') || 'nothing'} · In: ${(sw.into || []).map(([n, q]) => esc(q + ' ' + n)).join(', ') || 'nothing'}</p>` : '';
  let result = '';
  if (sw.state === 'finished' && sw.result) {
    const v = sw.result.verdict, a = sw.result.a, b = sw.result.b;
    const col = v.kind === 'better' ? 'var(--win)' : v.kind === 'worse' ? 'var(--loss)' : 'var(--text)';
    result = `<section class="panel" style="border-left:3px solid ${col}"><h2 style="margin-bottom:6px">${v.kind === 'better' ? 'It helped' : v.kind === 'worse' ? 'It made it worse' : 'Too close to call'}</h2>
      <p style="margin:0 0 10px">${esc(v.text)}</p>
      <div class="strip"><div><b>${pct(a.win_rate)}</b><span>your deck (${a.games} games)</span></div><div><b>${pct(b.win_rate)}</b><span>with the change (${b.games} games)</span></div>
      <div><b style="color:${col}">${v.change != null ? (v.change >= 0 ? '+' : '') + (100 * v.change).toFixed(1) : '–'}</b><span>points</span></div><div><b>${sw.result.paired.changed ?? '–'}</b><span>games that went differently</span></div></div>
      ${changes}</section>`;
  } else if (sw.state === 'error') result = `<p class="err">${esc(sw.error)}</p>`;
  else if (sw.state === 'stopped') result = '<p class="dim">Stopped.</p>';
  $('#main').innerHTML = `<div class="plain"><button class="back" id="swback">← All sims</button><h1 class="page">Test a change</h1>
    <p class="dim" style="margin:0">Edit a copy of your deck and both versions play the same games: same shuffles, same opponents. Any difference comes from the cards, not luck.</p></div>
    ${running ? `<section class="panel"><b>Testing a change to ${esc(sw.deck)}</b><p class="dim" style="margin:6px 0 10px">Playing ${sw.phase === 'A' ? 'your deck' : 'the changed version'}: ${sw.done}/${2 * sw.games} games.</p>${changes}<p style="margin:10px 0 0"><button class="btn stop" id="swstop">Stop</button></p></section>` : result}
    <section class="panel"><div class="form" style="margin-bottom:12px">
      <label>Deck<select id="swdeck">${DECKS.map(d => `<option value="${esc(d.id)}" ${d.id === cur.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></label>
      <label>Format<select id="swfmt">${fmts.map(f => `<option value="${esc(f.key)}" ${f.key === (cur.format || 'brawl') ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select></label>
      <label>Games each<select id="swn"><option>200</option><option selected>400</option><option>1000</option><option>2000</option></select></label>
    </div>
    <label>The changed version: edit the list below (swap cards in and out, keep the format)<textarea id="swlist" style="min-height:300px">${esc(cur.list || '')}</textarea></label>
    <p style="margin:12px 0 0"><button class="btn" id="swgo" ${running ? 'disabled' : ''}>Run both versions</button> <span id="swmsg" class="dim"></span></p></section>`;
  $('#swback').onclick = () => show('runs');
  $('#swdeck').onchange = () => { const d = DECKS.find(x => x.id === $('#swdeck').value); if (d) { $('#swlist').value = d.list; if (d.format) $('#swfmt').value = d.format; } };
  $('#swgo').onclick = async () => {
    const r = await api('/api/swap', {deck: $('#swdeck').value, format: $('#swfmt').value, games: +$('#swn').value, list_b: $('#swlist').value});
    if (r.error) { $('#swmsg').innerHTML = '<span class="err">' + esc(r.error) + '</span>'; return; }
    swapPage($('#swdeck').value);
  };
  const st = $('#swstop'); if (st) st.onclick = () => stopAll(st);
  if (running) setTimeout(() => { if (location.hash.startsWith('#swap')) swapPage(pick); }, 2000);
}
// ---- Opponents: the decks your deck is simmed against, per format
async function opponents() {
  const box = $('#opp'); if (!box) return;
  const g = await api('/api/gauntlet?format=' + encodeURIComponent(OPPFMT));
  const job = g.job || {}, building = job.state === 'running' && job.format === OPPFMT;
  const fmts = (STATUS.formats || []).map(f => f.key);
  const SHORT = {brawl: 'Historic Brawl', standardbrawl: 'Standard Brawl'};
  const nm = k => SHORT[k] || ((STATUS.formats || []).find(f => f.key === k) || {}).name || k;
  box.innerHTML = `<div class="secthead" style="margin:0 0 10px"><h2>Opponents</h2><span class="dim">${g.decks.length} deck${g.decks.length === 1 ? '' : 's'} in the ${esc(nm(OPPFMT))} gauntlet</span></div>
  <p class="dim" style="margin:0 0 12px">Your deck is simmed against every deck here. The closer this is to what you actually face, the more the numbers mean.</p>
  <div class="tabs" role="tablist" aria-label="Opponent format" style="margin-bottom:14px">${fmts.map(k => `<button role="tab" aria-selected="${k === OPPFMT}" data-ofmt="${esc(k)}">${esc(nm(k))}</button>`).join('')}</div>
  ${g.commander ? `<div class="form" style="margin-bottom:12px">
     <button class="btn" id="obuild" ${building ? 'disabled' : ''}>Build from commanders I've faced</button>

  ${running || st.state === 'error' || st.state === 'finished' || st.state === 'stopped' ? `<section class="panel" style="border-left:3px solid ${running ? 'var(--sim)' : st.state === 'error' ? 'var(--loss)' : 'var(--win)'}">

  <div class="panel"><h2 style="margin-bottom:10px">About</h2>
   <p style="margin:0 0 6px">Brewbench ${esc(up.current)} · Forge ${esc((st.forge || {}).version || 'not set up')} · Java ${esc((st.java || {}).version || '?')}</p>
   <p style="margin:0 0 12px">${up.newer ? `<b style="color:var(--hot)">Version ${esc(up.latest)} is out</b> (see the banner up top).` : up.latest ? 'You\'re on the latest version.' : '<span class="dim">Couldn\'t check for updates.</span>'} <button class="btn ghost" id="supd" style="min-height:32px;padding:0 12px;font-size:13px;margin-left:6px">Check now</button></p>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn ghost" href="/api/diagnostics" style="display:inline-flex;align-items:center;text-decoration:none">Download diagnostics</a>
   <button class="btn ghost" id="ssetup">Setup checklist</button></div>
   <p class="dim" style="font-size:13px;margin:10px 0 0">Diagnostics is a zip of logs and settings to attach to a bug report. It leaves out your Arena account and sharing key.</p></div></div>`;
  $('#ssave').onclick = async () => { const r = await api('/api/settings', {ai_profile: $('#sai').value, instances: $('#sinst').value, edhrec: $('#sedh').checked}); $('#smsg').textContent = r.error || 'Saved. Applies to the next run.'; };
  $('#ssetup').onclick = () => show('setup');
  $('#supd').onclick = async () => { try { localStorage.removeItem('upd-hide'); } catch (e) {} await updateBanner(true); settings(); };
  shareBox();
}

async function shareBox() {
  const sh = await api('/api/share');
  const last = sh.last ? `Last sent ${new Date(sh.last.at * 1000).toLocaleString()}: ${sh.last.matches} games, ${sh.last.sims} sim summaries${sh.last.decks ? ', ' + sh.last.decks + ' lists' : ''}.` : 'Nothing sent yet.';
  const el = document.createElement('section');
  el.className = 'panel'; el.id = 'sharebox';
  el.innerHTML = `<div class="secthead" style="margin:0 0 6px"><h2>Share with Brewbench</h2><a href="${esc(sh.site)}" target="_blank" rel="noopener">Open the site →</a></div>
  <p class="dim" style="margin:0 0 14px;max-width:760px">Optional. Your games feed the site's meta, matchups and leaderboards. What goes up: the day, format, result, your deck's colours and commander, the opponent's colours and commander, your rank, and your sim results. Never your Arena name, your opponents' names or your account. Only what you see under "See exactly what's sent".</p>
  <div class="form">
    <label>Name on the site<input id="shname" value="${esc(sh.name)}" placeholder="leave empty to stay anonymous" maxlength="24" style="min-width:260px"></label>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--text)"><input type="checkbox" id="shpub" ${sh.public ? 'checked' : ''} style="min-height:auto"> Show me on leaderboards</label>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--text)"><input type="checkbox" id="shlists" ${sh.lists ? 'checked' : ''} style="min-height:auto"> Share my decklists too (they build everyone's meta gauntlet)</label>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--text)"><input type="checkbox" id="shauto" ${sh.auto ? 'checked' : ''} style="min-height:auto"> Send new games automatically</label>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center">
    <button class="btn" id="shgo">${sh.registered ? 'Save and send now' : 'Start sharing'}</button>
    <button class="btn ghost" id="shprev">See exactly what's sent</button>
    ${sh.registered ? '<button class="btn ghost" id="shforget" style="border-color:var(--loss);color:var(--loss)">Remove everything from the site</button>' : ''}
  </div>
  <p id="shmsg" class="dim" style="margin:12px 0 0" aria-live="polite">${sh.busy ? 'Sending…' : sh.error ? '<span class="err">Last try failed: ' + esc(sh.error) + '</span>' : esc(last)}</p>
  <pre id="shpre" style="display:none;white-space:pre-wrap;max-height:320px;overflow:auto;background:#0B0B0C;border-radius:10px;padding:12px;font-size:12px;margin:12px 0 0"></pre>`;
  const old = $('#sharebox'); old ? old.replaceWith(el) : $('#main').appendChild(el);
  const body = now => ({name: $('#shname').value.trim(), public: $('#shpub').checked, lists: $('#shlists').checked, auto: $('#shauto').checked, now});
  $('#shgo').onclick = async () => {
    if (!sh.registered && !confirm('Start sharing your games with the Brewbench site? You can remove everything later.')) return;
    const r = await api('/api/share', body(true));
    if (r.error) { $('#shmsg').innerHTML = '<span class="err">' + esc(r.error) + '</span>'; return; }
    $('#shmsg').textContent = 'Sending… the first time can take a minute.';
    const wait = async () => { const st = await api('/api/share'); if (st.busy) return setTimeout(wait, 1500); shareBox(); };
    setTimeout(wait, 1500);
  };
  $('#shprev').onclick = async () => {
    $('#shpre').style.display = 'block'; $('#shpre').textContent = 'Working it out…';
    const p = await api('/api/share/preview');
    $('#shpre').textContent = p.error ? p.error : `${p.matches} real games, ${p.sims} sim summaries, ${p.decks} lists. A few examples:\n\n` + JSON.stringify(p.sample, null, 1);
  };
  const fg = $('#shforget');
  if (fg) fg.onclick = async () => {
    if (!confirm('Delete everything you have uploaded from the Brewbench site and unlink this PC? This can\'t be undone.')) return;
    const r = await api('/api/share/forget', {});
    $('#shmsg').innerHTML = r.error ? '<span class="err">' + esc(r.error) + '</span>' : 'Done: it\'s all gone from the site.';
    if (!r.error) setTimeout(shareBox, 1200);
  };
}

async function stopAll(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Stopping…'; }
  const r = await api('/api/stop', {});
  if (btn) btn.textContent = r.ended ? 'Stopped' : 'Stopped';
  setTimeout(poll, 500);
  if (location.hash.startsWith('#runs') || location.hash === '#new') setTimeout(() => route(), 1500);
}
function simming() {
  const j = STATUS.job, o = STATUS.outside || {}, sw = STATUS.swap || {};
  const mine = j && (j.state === 'running' || j.state === 'stopping');
  const swap = sw.state === 'running', op = (STATUS.opt || {}).state === 'running';
  return {mine, j, swap, sw, op, outside: !mine && !swap && !op && (o.games || o.drivers), any: mine || swap || op || o.games || o.drivers};
}
let POLL;
async function poll() {
  clearTimeout(POLL);
  try {
    STATUS = await api('/api/status');
    const s = simming(), j = s.j;
    const text = s.op ? `Optimising ${esc(STATUS.opt.deck)}: ${esc(STATUS.opt.last || '')}`
      : s.swap ? `Testing a change to ${esc(s.sw.deck)}: ${s.sw.done}/${2 * s.sw.games} games`
      : s.mine ? `${j.state === 'stopping' ? 'Stopping' : 'Simming'} ${esc(j.label)}: ${j.done}/${j.games} games`
      : s.outside ? 'Sims running (started outside the app)'
      : j && j.missing ? `<span class="err" title="${esc((j.problems || []).join(', '))}">Last run: ${j.missing} of ${j.games} games couldn't be played (PC too busy?)</span>`
      : j ? `Last run ${esc(j.state)}` : '';
    $('#job').innerHTML = text + (s.any && !(j && j.state === 'stopping') ? ' <button class="btn stop" id="hstop">Stop sims</button>' : '');
    const hs = $('#hstop'); if (hs) hs.onclick = () => stopAll(hs);
    const banner = $('#runbanner'); if (banner) banner.hidden = !s.any;
  } catch (e) { $('#job').textContent = 'Brewbench has stopped'; }
  POLL = setTimeout(poll, 2000);
}
poll();
Promise.all([api('/api/decks'), api('/api/setup')]).then(([d, st]) => { DECKS = d; if (!route()) { if (st.ready) location.replace('/tracker'); else show('setup'); } });
// ---- updates: a banner when a newer Brewbench is out
async function updateBanner(force) {
  let u; try { u = await api('/api/update' + (force ? '?force=1' : '')); } catch (e) { return; }
  let el = $('#upd');
  if (!u.newer) { if (el) el.remove(); return; }
  let hidden; try { hidden = localStorage.getItem('upd-hide') === u.latest; } catch (e) {}
  if (hidden && !force) return;
  if (!el) { el = document.createElement('div'); el.id = 'upd'; document.querySelector('header').after(el); }
  const ins = u.install || {}, busy = ins.state === 'downloading' || ins.state === 'starting';
  el.className = 'updbar';
  el.innerHTML = `<b>Brewbench ${esc(u.latest)} is out</b><span class="dim">You have ${esc(u.current)}.${u.notes ? ' ' + esc(u.notes) : ''}</span>
    <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
    ${ins.state === 'error' ? `<span class="err">Couldn't download it here.</span><a class="btn" style="min-height:36px;display:inline-flex;align-items:center;text-decoration:none" href="${esc(u.page || u.url)}" target="_blank" rel="noopener">Download it instead</a>` : ''}
    ${busy ? `<span>${ins.state === 'starting' ? 'Installing… Brewbench will reopen by itself.' : 'Downloading… ' + (ins.total ? Math.round(100 * ins.done / ins.total) + '%' : '')}</span>`
      : u.can_install ? '<button class="btn" id="updgo" style="min-height:36px">Update now</button>' : `<a class="btn" style="min-height:36px;display:inline-flex;align-items:center;text-decoration:none" href="${esc(u.page || u.url)}" target="_blank" rel="noopener">Get it</a>`}
    ${busy ? '' : '<button class="btn ghost" id="updlater" style="min-height:36px">Later</button>'}</span>`;
  const go = $('#updgo');
  if (go) go.onclick = async () => {
    const r = await api('/api/update/install', {});
    if (r.error) { alert(r.error); return; }
    updateBanner();
  };
  const later = $('#updlater');
  if (later) later.onclick = () => { try { localStorage.setItem('upd-hide', u.latest); } catch (e) {} el.remove(); };
  if (busy) setTimeout(updateBanner, 1000);
}
updateBanner();
setInterval(updateBanner, 6 * 3600 * 1000);
</script>
</body>
</html>
