<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brewbench · my games</title>
<style>
:root{
  --bg:#ffffff; --fg:#18181b; --muted:#71717a; --faint:#a1a1aa; --line:#ececef; --hover:#f6f6f7; --sel:#f1f1f4;
  --me:#5b5bd6; --opp:#d6409f; --win:#30a46c; --loss:#e5484d; --draw:#d39e2a; --accent:#5b5bd6;
  --sunk:#f6f6f7; --soft:var(--sunk); --panel:transparent;
}
:root{color-scheme:dark;
  --bg:#0f0f11; --fg:#ededef; --muted:#9b9ba4; --faint:#62626b; --line:#232327; --hover:#18181b; --sel:#1d1d21;
  --me:#7c7cf0; --opp:#e0569f; --win:#3dd68c; --loss:#ff6369; --draw:#f1c35a; --accent:#7c7cf0; --sunk:#18181b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.55 "Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}
.small{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);padding:24px 0;font-size:14px}
b,strong{font-weight:600}

/* top bar */
.shell{display:block}
.side{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:28px;padding:0 max(24px,calc((100vw - 1180px)/2));height:56px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14.5px;white-space:nowrap}
.brand svg{width:20px;height:20px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{all:unset;cursor:pointer;padding:6px 11px;border-radius:6px;color:var(--muted);font-size:14px;white-space:nowrap}
nav button:hover{color:var(--fg);background:var(--hover)}
nav button.on{color:var(--fg);background:var(--sel);font-weight:500}
.side-foot{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.side-foot br{display:none}
.side-foot b{color:var(--fg);font-weight:500}
.content{max-width:1180px;margin:0 auto;padding:40px 24px 80px}
@media (max-width:760px){.side{gap:12px;padding:0 14px}.side-foot,.brand span{display:none}.content{padding:24px 16px 60px}}

/* rank header */
.rankband{display:grid;grid-template-columns:auto 1fr auto;gap:48px;align-items:end;padding:0 0 32px;margin:0 0 36px;border-bottom:1px solid var(--line)}
.rank-name{font-size:44px;line-height:1;font-weight:600;letter-spacing:-.035em}
.piptrack{display:flex;gap:4px;margin-top:14px}
.piptrack i{width:26px;height:4px;border-radius:2px;background:var(--line)}
.piptrack i.on{background:var(--me)}
.rank-sub{color:var(--muted);font-size:13.5px;margin-top:10px}
.form{display:flex;gap:3px;align-items:flex-end;height:28px}
.form span{width:8px;height:10px;border-radius:2px;background:var(--line)}
.form span.W{background:var(--win);height:28px} .form span.L{background:var(--loss);height:14px;opacity:.8}
.form-cap{font-size:12.5px;color:var(--muted);margin-top:10px}
.bandstats{display:flex;gap:40px}
.bandstats div{text-align:right}
.bandstats b{display:block;font-size:28px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.bandstats span{font-size:12.5px;color:var(--muted)}
@media (max-width:860px){.rankband{grid-template-columns:1fr;gap:22px;align-items:start}.bandstats{gap:28px}.bandstats div{text-align:left}.rank-name{font-size:36px}}

/* type */
h1{font-size:26px;margin:0;font-weight:600;letter-spacing:-.025em}
h2{font-size:20px;margin:0;font-weight:600;letter-spacing:-.02em}
h3{font-size:14px;margin:0 0 10px;font-weight:600;letter-spacing:-.01em}
.sec{margin:40px 0 14px;font-size:15px}
.chapter{margin:0 0 64px}
.chapter > header{display:flex;flex-direction:column;gap:4px;margin:0 0 24px}
.chapter > header p{margin:0;color:var(--muted);font-size:14px}
.jump{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 44px}
.jump a{text-decoration:none;font-size:13.5px;padding:5px 11px;border-radius:6px;color:var(--muted)}
.jump a:hover{color:var(--fg);background:var(--hover)}

/* blocks: no boxes */
.panel{background:none;border:0;box-shadow:none;padding:0;border-radius:0;min-width:0;overflow-x:auto}
.chart{background:none;border:0;box-shadow:none;padding:0;min-width:0}
.charts .chart,.pane .chart{background:none}
.panel > .sub,.chart > .sub{margin:-6px 0 12px}
.chapter .grid{display:block;columns:2 440px;column-gap:56px}
.chapter .grid > *{break-inside:avoid;margin:0 0 44px;width:100%;display:block}
.chapter .grid > .wide{column-span:all}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px;margin-bottom:8px}
.grid{display:block}
.ov{display:block}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:12.5px;font-weight:400;padding-top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap;padding-right:0;padding-left:12px}
td a,.plays a{text-decoration:none}
td a:hover,.plays a:hover{color:var(--accent)}
.bar{display:inline-block;width:52px;height:4px;background:var(--line);border-radius:2px;margin-right:10px;vertical-align:middle;overflow:hidden}
.bar span{display:block;height:100%;background:var(--me)}
.more{all:unset;cursor:pointer;display:inline-block;margin-top:10px;font-size:13px;color:var(--muted)}
.more:hover{color:var(--fg)}
tr.extra{display:none} .showall tr.extra{display:table-row}


/* neural net tab */
.sim-game{border-top:1px solid var(--line);padding:12px 0}
.sim-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
.sim-side{margin:6px 0}
.sim-h{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:4px}
.sim-h span:first-child{color:var(--fg)}
.sim-chips{display:flex;flex-wrap:wrap;gap:5px}
.sim-chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line)}
.sim-chip.cmd{border-color:var(--accent)} .sim-chip.tap{opacity:.55} .sim-chip.tok{font-style:italic}
.sim-log{margin-top:8px;font-size:12px;color:var(--faint);font-family:ui-monospace,Consolas,monospace;line-height:1.5}
.sim-log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nn-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
@media (max-width:1100px){.nn-wrap{grid-template-columns:1fr}}
.nn-svg{width:100%;height:auto;display:block}
.nn-svg text{font:12px "Geist",system-ui,sans-serif;fill:var(--muted)}
.nn-svg .val{fill:var(--faint);font-variant-numeric:tabular-nums}
.nn-svg .out{font-size:20px;font-weight:600;fill:var(--fg)}
.nn-svg line{transition:stroke-opacity .5s,stroke-width .5s}
.nn-svg circle{transition:fill .5s}
.nn-side,.nn-col{display:grid;gap:28px}
.nn-flow line{stroke-dasharray:3 7}
@media (prefers-reduced-motion:no-preference){
  .nn-flow line{animation:nnflow 1.6s linear infinite}
  .nn-train line{stroke-dasharray:2 6;animation:nnflow .5s linear infinite}
  .nn-train circle{animation:nnpulse 1s ease-in-out infinite alternate}
}
@keyframes nnflow{to{stroke-dashoffset:-20}}
@keyframes nnpulse{from{opacity:.55}to{opacity:1}}
.nn-pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:3px 10px;border:1px solid var(--line);border-radius:99px}
.nn-dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.nn-dot.live{background:var(--win)} .nn-dot.train{background:var(--draw)}
.nn-bar{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;font-size:13px;margin:5px 0}
.nn-bar .t{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.nn-bar .t i{position:absolute;top:0;bottom:0;border-radius:3px}
/* games */
.games{display:grid;grid-template-columns:300px minmax(0,1fr);gap:56px;align-items:start}
@media (max-width:1000px){.games{grid-template-columns:1fr;gap:32px}}
.list{position:sticky;top:80px;max-height:calc(100vh - 110px);overflow:auto;margin-left:-10px;padding-right:4px}
@media (max-width:1000px){.list{position:static;max-height:360px}}
.filters{display:flex;flex-direction:column;gap:8px;padding:0 0 14px 10px;position:sticky;top:0;background:var(--bg);z-index:1}
.filters > div{display:flex;gap:8px}
.filters input,.filters select,select.big{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px;min-width:0;flex:1}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--faint)}
.item{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;padding:9px 10px;border-radius:7px;cursor:pointer}
.item:hover{background:var(--hover)} .item.sel{background:var(--sel)}
.item .thumb{display:none}
.item .cmd{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{color:var(--muted);font-size:12.5px}
.item .badge{width:8px;height:8px;min-width:0;padding:0;border-radius:50%;font-size:0;color:transparent}
.badge{display:inline-grid;place-items:center;border-radius:5px;padding:2px 8px;font-size:12.5px;font-weight:500;color:#fff}
.Win{background:var(--win)} .Loss{background:var(--loss)} .Draw{background:var(--draw)}
.pips{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.thumb{width:40px;height:30px;border-radius:5px;object-fit:cover;display:block}

#detail{padding:0}
.ghead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.ghead h2{font-size:24px;letter-spacing:-.025em}
.ghead .badge{align-self:center}
.gmeta{display:flex;flex-wrap:wrap;gap:4px 18px;margin:10px 0 24px;color:var(--muted);font-size:13.5px}
.subtabs{display:flex;gap:22px;margin:0 0 28px;border-bottom:1px solid var(--line)}
.subtabs button{all:unset;cursor:pointer;padding:0 0 11px;margin-bottom:-1px;color:var(--muted);font-size:14px;border-bottom:1.5px solid transparent}
.subtabs button:hover{color:var(--fg)}
.subtabs button.on{color:var(--fg);border-bottom-color:var(--fg)}

.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 32px}
.hero figure{margin:0;position:relative;height:110px;border-radius:10px;overflow:hidden;background:var(--sunk)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero figcaption{position:absolute;inset:auto 0 0 0;padding:24px 14px 11px;color:#fff;font-weight:500;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.hero figcaption small{display:block;font-weight:400;opacity:.8;font-size:12.5px}
@media (max-width:620px){.hero{grid-template-columns:1fr}}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 28px;margin:0 0 36px}
.tile{background:none;padding:0;min-width:0}
.tile > span:first-child{color:var(--muted);font-size:12.5px;display:block;margin-bottom:4px}
.tile b{font-size:20px;font-weight:500;letter-spacing:-.02em}
.tile .me{color:var(--fg)} .tile .opp{color:var(--faint)}
.tile .small{display:block;margin-top:2px;font-size:12.5px}

.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:40px 48px;margin:0 0 12px}
.chart h3{margin-bottom:2px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
svg text{fill:var(--faint);font-size:13px;font-family:inherit}
svg .grid{stroke:var(--line);stroke-width:1}
svg .me{stroke:var(--me);fill:var(--me)} svg .opp{stroke:var(--opp);fill:var(--opp)}
svg polyline{fill:none!important;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg polyline.opp{stroke-width:1.6}
svg circle{fill:transparent!important;stroke:none!important}
svg .area{stroke:none}
svg .bar-me{fill:var(--me)} svg .bar-opp{fill:var(--opp)} svg .bar-win{fill:var(--me)} svg .bar-loss{fill:var(--opp)}

.plays td{font-size:13.5px}
.chip{display:inline-block;margin:0 10px 4px 0;padding:0;background:none;border:0;font-size:13.5px}
.chip.me{color:var(--fg)} .chip.opp{color:var(--fg)}
.chip.land,.land{color:var(--faint)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.gallery figure{margin:0;font-size:12px;color:var(--muted)}
.gallery img{width:100%;border-radius:6px;display:block;margin-bottom:5px}
.gallery .t{display:inline-block;padding:0 6px;border-radius:4px;color:#fff;font-weight:500}
.hand{display:flex;gap:8px;flex-wrap:wrap}
.hand img{width:82px;border-radius:5px;display:block}
.hand .nm{width:82px;height:114px;border-radius:5px;background:var(--sunk);font-size:11px;padding:6px;display:flex;align-items:center;text-align:center}
.replay{background:none;padding:0}
.vidwrap{margin:12px 0}
.gamevid{width:100%;max-height:70vh;background:#000;border-radius:8px;display:block;margin-bottom:6px}
.vturns{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.vturn{border:1px solid var(--line);background:none;color:inherit;border-radius:6px;padding:2px 8px;font:inherit;font-size:12px;cursor:pointer}
.vturn.me{border-color:var(--me)}.vturn.opp{border-color:var(--opp)}.vturn:hover{background:var(--line)}
.cliphead{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.clips{display:flex;gap:12px;flex-wrap:wrap}.clip{margin:0;width:170px}
.clip video{width:170px;aspect-ratio:9/16;background:#000;border-radius:8px;display:block;margin-bottom:4px}
.replay input[type=range]{width:100%;accent-color:var(--fg);margin:0 0 6px}
.zone{display:flex;gap:6px;flex-wrap:wrap;min-height:60px;padding:10px 0}
.perm{position:relative;width:62px}
.perm img{width:62px;border-radius:4px;display:block}
.perm.tap img{transform:rotate(6deg);opacity:.55}
.perm .pt{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.8);color:#fff;font-size:10.5px;font-weight:600;padding:0 4px;border-radius:3px}
.perm .x{position:absolute;left:3px;top:3px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:0 4px;border-radius:3px}
.perm .nm{width:62px;height:86px;border-radius:4px;background:var(--sunk);font-size:9.5px;padding:4px;overflow:hidden}
.zlabel{font-size:13.5px;font-weight:500;color:var(--fg)!important}
.lands{font-size:12.5px;color:var(--muted)}
.toggle{all:unset;cursor:pointer;font-size:13px;color:var(--muted);padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
.toggle:hover{color:var(--fg);border-color:var(--faint)}
h3 .toggle{float:right;font-weight:400}
select.big{min-width:220px;flex:none}
#preview{position:fixed;z-index:50;width:250px;border-radius:12px;pointer-events:none;box-shadow:0 20px 50px rgba(0,0,0,.28);display:none}
hr{border:0;border-top:1px solid var(--line)!important}
@media (prefers-reduced-motion:no-preference){nav button,.subtabs button,.item{transition:background-color .12s,color .12s}}

/* minimal pass 2 */
.chart[style]{border:0!important;background:none!important;padding:0!important;box-shadow:none!important}
td{padding-right:16px} td:last-child,th:last-child{padding-right:0}
td.num + td, th.num + th{padding-left:18px}
.side-foot span + span::before{content:"";display:inline-block;width:1px;height:11px;background:var(--line);margin:0 12px;vertical-align:-1px}

/* upgrades / practice */
.kpis{display:flex;flex-wrap:wrap;gap:16px 56px;margin:0 0 44px}
.kpi b{display:block;font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
#tab-upgrades .ov{display:block;columns:2 440px;column-gap:56px}
#tab-upgrades .ov > *{break-inside:avoid;margin:0 0 44px;display:block;width:100%}
#tab-upgrades .ov > [style*="grid-column"]{column-span:all}
#tab-upgrades td{padding-top:10px;padding-bottom:10px}
#tab-practice .panel{max-width:900px}
#tab-matchups .panel{margin-bottom:40px}

/* dataviz pass */
svg polyline.opp{stroke-width:2}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-size:12.5px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none;min-width:110px}
.tip .k{color:var(--muted)} .tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
svg .xhair{stroke:var(--faint);stroke-width:1;display:none}
svg .hit{fill:transparent;cursor:crosshair}
svg .end{stroke:var(--bg)!important;stroke-width:2!important}
svg text.endlab{fill:var(--muted);font-size:12.5px}

/* critique fixes */
.tile .opp{color:var(--muted)}
svg text{fill:var(--muted)}
.form span.W{background:var(--me)} .form span.L{background:var(--faint);opacity:1}
.item .res{font-size:12px;color:var(--muted)}
.item .res b{font-weight:500;color:var(--fg)}
.jump{position:sticky;top:56px;z-index:4;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0;margin:-10px 0 34px}
.jump a.on{color:var(--fg);background:var(--sel)}

#tab-highlights .panel{max-width:1000px}
.comps{display:flex;gap:16px;flex-wrap:wrap}.comp{margin:0;width:200px}.comp video{width:200px;aspect-ratio:9/16;background:#000;border-radius:8px;display:block;margin-bottom:6px}.comp .empty9{width:200px;aspect-ratio:9/16;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;box-sizing:border-box;color:var(--muted);font-size:13px;margin-bottom:6px}

/* at a glance */
.glance{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:36px 44px;margin:0 0 60px}
.glance h2{grid-column:1/-1;margin:0 0 -12px}
.ins b{display:block;font-size:34px;font-weight:500;letter-spacing:-.035em;line-height:1.05}
.ins b small{font-size:15px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:6px}
.ins p{margin:8px 0 6px;font-size:14.5px;line-height:1.45}
.ins a{font-size:13px;color:var(--muted);text-decoration:none}
.ins a:hover{color:var(--fg)}
.ins.good b{color:var(--me)} .ins.bad b{color:var(--opp)}
.takeaway{margin:6px 0 0;font-size:15px;color:var(--fg)!important;max-width:70ch}
.chapter .hide{display:none!important}
.chapter.open .hide{display:block!important}
.chapter .moreblocks{all:unset;cursor:pointer;font-size:13.5px;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:7px}
.chapter .moreblocks:hover{color:var(--fg);border-color:var(--faint)}
.keymoment{border-left:3px solid var(--loss);padding:10px 14px;margin:4px 0 18px;background:color-mix(in srgb,var(--loss) 6%,transparent);border-radius:0 8px 8px 0}
.keymoment.good{border-left-color:var(--win);background:color-mix(in srgb,var(--win) 6%,transparent)}
.keymoment b{display:block;font-size:15px;font-weight:600;margin:2px 0 4px}.keymoment p{margin:4px 0}
.better{margin-top:4px;color:var(--fg)}.better span{font-weight:600;color:var(--me)}
table.decisions td{vertical-align:top;padding-top:10px;padding-bottom:10px}
.wpwrap{align-items:start;margin:6px 0 18px}.wpwrap .chart{margin:0}
h3.sub{font-size:13px;font-weight:600;margin:0 0 8px}
.swing{border-left:3px solid var(--line);padding:4px 10px;margin:0 0 10px}.swing b{display:block;font-size:15px;font-weight:600}.swing p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.fbrow{margin-top:4px}.dis{background:none;border:0;padding:0;color:var(--faint);font:inherit;font-size:12px;cursor:pointer}.dis:hover{color:var(--fg);text-decoration:underline}
.fbform{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:6px;padding:8px 10px;background:var(--sunk);border-radius:8px;font-size:13px}

<style>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const M = (D.matches || []).slice().reverse();          // newest first
const VIDEOS = Array.isArray(D.videos) ? Object.fromEntries(D.videos.map(id=>[id,{turns:{},clips:[]}])) : (D.videos || {});
function seekVideo(s){ const v = document.querySelector('.gamevid'); if(!v) return;
  const b = document.querySelector('.subtabs button[data-pane="summary"]'); if(b && !b.classList.contains('on')) b.click();
  const go = () => { v.currentTime = Math.max(0, s); v.play().catch(()=>{}); };
  if(v.readyState >= 1) go(); else v.addEventListener('loadedmetadata', go, {once:true});
  v.scrollIntoView({behavior:'smooth', block:'center'}); }
document.addEventListener('click', e=>{ const b = e.target.closest('[data-vseek]'); if(!b) return; e.preventDefault(); seekVideo(+b.dataset.vseek); });
function videoBlock(m){
  const v = VIDEOS[m.match_id]; if(!v) return '';
  const id = esc(m.match_id), act = Object.fromEntries((m.timeline||[]).map(x=>[x.t,x.a]));
  const turns = Object.entries(v.turns||{}).map(([t,s])=>[+t,s]).sort((a,b)=>a[0]-b[0]);
  const chips = turns.map(([t,s])=>`<button class="vturn ${act[t]==='me'?'me':'opp'}" data-vseek="${s}" title="${act[t]==='me'?'Your':'Their'} turn ${t}">${t}</button>`).join('');
  const clips = (v.clips||[]).map(c=>`<figure class="clip"><video controls preload="metadata" src="recordings/clips/${esc(c.file)}"></video>
    <figcaption><b>${esc(c.title)}</b><br><span class="small">${esc(c.line)} · ${c.secs}s</span><br><a href="recordings/clips/${esc(c.file)}" download>Download</a></figcaption></figure>`).join('');
  return `<div class="vidwrap"><video class="gamevid" controls preload="metadata" src="recordings/${id}.mp4"></video>
    <div class="small">Recording · <a href="recordings/${id}.mp4" download>Download</a> · speed
      ${[1,1.5,2,4].map(r=>`<button class="toggle vspd" style="float:none" data-r="${r}">${r}×</button>`).join('')}</div>
    ${turns.length?`<div class="vturns"><span class="small">Jump to turn${v.estimated?' (approx.)':''}:</span>${chips}</div>`:''}
    ${clips?`<div class="cliphead">Highlight clips · 9:16, ready for TikTok</div><div class="clips">${clips}</div>`:''}</div>`;
}
const C = D.cards || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card = g => C[g] || {name:'Card #'+g, type:'', url:''};
Object.values(C).forEach(c=>{ if(c && typeof c.name==='string') c.name = c.name.replace(/<[^>]+>/g,''); });
{ // back faces of double-faced cards arrive as bare names: borrow the full card's data for that face
  const faces = {}; Object.values(C).forEach(c=>{ if(c && /\/\//.test(c.name||'') && c.oracle) c.name.split(' // ').forEach((f,i)=>{ faces[f] ||= {c, i}; }); });
  Object.values(C).forEach(c=>{ if(!c || c.oracle || !faces[c.name]) return; const {c:full, i} = faces[c.name];
    c.oracle = (full.oracle.split(' // ')[i] || full.oracle); c.type = (full.type||'').split(' // ')[i] || full.type;
    c.kw = full.kw; c.img ||= full.img; c.url ||= full.url; c.cmc ??= full.cmc; });
}
const pct = (w,l) => w+l ? Math.round(100*w/(w+l)) : 0;
const SHORT = {Win:'W', Loss:'L', Draw:'D'};
function niceDate(d){ if(!d) return ''; const [day, time] = d.split(' '); const dt = new Date(day+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0); const diff = Math.round((today-dt)/86400000);
  const label = diff===0 ? 'Today' : diff===1 ? 'Yesterday' : dt.toLocaleDateString(undefined,{day:'numeric',month:'short'});
  return time ? `${label} ${time}` : label; }

/* ---------- header: rank band ---------- */
function header(){
  const w = M.filter(m=>m.result==='Win').length, l = M.filter(m=>m.result==='Loss').length;
  const last20 = M.slice(0,20), l20 = winsLosses(last20);
  const rank = (M.find(m=>m.rank_after)||{}).rank_after || (M[0]||{}).rank_before;
  const step = rank && rank.class!=='Mythic' ? (rank.step ?? 0) : null;
  let goal; try{ goal = JSON.parse(localStorage.getItem('goal')||'null'); }catch(e){}
  goal ||= {cls:'Diamond', lvl:4};
  let goalTxt = '';
  if(rank){ const pips = Math.max(0, Math.round((rankVal({class:goal.cls,level:goal.lvl,step:0}) - rankVal(rank))*6));
    goalTxt = pips ? `${pips} pips to ${goal.cls==='Mythic'?'Mythic':goal.cls+' '+goal.lvl}` : `Goal of ${goal.cls==='Mythic'?'Mythic':goal.cls+' '+goal.lvl} reached`; }
  const form = M.slice(0,20).reverse().map(m=>`<span class="${m.result==='Win'?'W':m.result==='Loss'?'L':''}" title="${esc(m.result)} vs ${esc(m.opp_cmd)}"></span>`).join('');
  const mine = (M[0]||{}).my_commanders || [], deckName = (M[0]||{}).my_cmd || '';
  const art = card(mine[0]).art; const hi = $('#heroart'); if(art){ hi.src = art; hi.style.display=''; } else hi.style.display='none';
  $('#kpis').innerHTML = `
    <div class="kick">${deckName ? esc(deckName) + ' · ' : ''}${esc(goalTxt || 'Ranked')}</div>
    <h1 class="hname">${esc(rankLabel(rank))}</h1>
    ${step!=null ? `<div class="piptrack" aria-label="${step} of 6 pips">${[0,1,2,3,4,5].map(i=>`<i class="${i<step?'on':''}"></i>`).join('')}</div>` : ''}
    <div class="hstats">
      <div><b>${w}–${l}</b> <span>record</span></div>
      <div><b class="sim">${pct(w,l)}%</b> <span>win rate</span></div>
      <div><b>${pct(...l20)}%</b> <span>last ${last20.length}</span></div>
    </div>
    <div class="hform"><div class="form" aria-label="Last 20 results">${form}</div><small>Last ${last20.length}, oldest to newest: ${l20[0]} wins, ${l20[1]} losses</small></div>`;
  $('#sub').innerHTML = `<span>${M.length} games</span><span>Updated ${esc((D.generated||'').split(' ').slice(-1)[0])}</span>${D.lan_url ? `<span>Phone: <b>${esc(D.lan_url.replace(/^http:\/\//,'').replace(/\/$/,''))}</b></span>` : ''}`;
}

/* ---------- charts ---------- */
const CHARTS = []; let chartSeq = 0;
function lineChart({title, xs, series, logScale=false, fmt=v=>v, xLabel='Turn'}){
  const W=520, H=200, L=36, R=44, T=12, B=26;
  const all = series.flatMap(s=>s.values).filter(v=>v!=null);
  if(!xs.length || !all.length) return `<div class="chart"><h3>${esc(title)}</h3><div class="empty">No data</div></div>`;
  const useLog = logScale && Math.max(...all) > 100;
  const tf = v => useLog ? Math.log10(Math.max(v,0)+1) : v;
  let lo = Math.min(0, ...all.map(tf)), hi = Math.max(1, ...all.map(tf));
  if(hi===lo) hi=lo+1;
  const x = i => L + (xs.length<2 ? (W-L-R)/2 : i*(W-L-R)/(xs.length-1));
  const y = v => T + (H-T-B)*(1-(tf(v)-lo)/(hi-lo));
  let ticks;
  if(useLog){ ticks=[0,10,100,1000,10000,100000].filter(v=>tf(v)<=hi*1.05); }
  else { const step=niceStep((hi-lo)/3); ticks=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) ticks.push(+v.toFixed(6)); }
  let g = ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${fmtNum(v)}</text>`).join('');
  const every = Math.max(1, Math.ceil(xs.length/8));
  g += xs.map((t,i)=> i%every===0 || i===xs.length-1 ? `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${t}</text>` : '').join('');
  const ends = [];
  series.forEach((s,si)=>{
    const pts = s.values.map((v,i)=>v==null?null:[x(i),y(v),v,xs[i]]).filter(Boolean);
    if(!pts.length) return;
    if(si===0 && pts.length>1) g += `<polygon class="area" fill="var(--${s.cls})" fill-opacity=".1" points="${pts[0][0]},${y(Math.max(lo,0))} ${pts.map(p=>p[0]+','+p[1]).join(' ')} ${pts[pts.length-1][0]},${y(Math.max(lo,0))}"/>`;
    g += `<polyline class="${s.cls}" fill="none" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
    const e = pts[pts.length-1]; ends.push({e, s});
  });
  // end markers + direct labels (nudged apart only if they'd overlap)
  ends.sort((a,b)=>a.e[1]-b.e[1]);
  let lastY = -99;
  ends.forEach(({e, s})=>{ const ly = Math.max(e[1]+4, lastY+14); lastY = ly;
    g += `<circle class="${s.cls} end" cx="${e[0]}" cy="${e[1]}" r="4" style="fill:var(--${s.cls})!important"/>`;
    g += `<text class="endlab" x="${e[0]+9}" y="${ly}">${esc(fmt(fmtNum(e[2])))}</text>`; });
  const id = chartSeq++;
  CHARTS[id] = {xs, series, fmt, x, y, L, R, W, H, T, B, xLabel};
  g += `<line class="xhair" x1="0" x2="0" y1="${T}" y2="${H-B}"/><rect class="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" data-chart="${id}"/>`;
  const legend = series.length > 1 ? `<div class="legend">${series.map(s=>`<span><i style="background:var(--${s.cls})"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart"><h3>${esc(title)}${useLog?' <span class="small">log scale</span>':''}</h3>${legend}
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg></div>`;
}
// crosshair + tooltip for every line chart, and tooltips for anything with data-tip
const tipEl = document.getElementById('tip');
function showTip(html, ev){ tipEl.innerHTML = html; tipEl.style.display='block';
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = (ev.clientX + 16 + w > innerWidth ? ev.clientX - 16 - w : ev.clientX + 16) + 'px';
  tipEl.style.top = Math.min(innerHeight - h - 8, Math.max(8, ev.clientY - h/2)) + 'px'; }
function hideTip(){ tipEl.style.display='none'; }
document.addEventListener('mousemove', ev=>{
  const hit = ev.target.closest && ev.target.closest('rect.hit');
  document.querySelectorAll('svg .xhair').forEach(l=>{ if(!hit || l.parentNode!==hit.parentNode) l.style.display='none'; });
  if(hit){
    const c = CHARTS[hit.dataset.chart], svg = hit.ownerSVGElement, pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const n = c.xs.length, i = n<2 ? 0 : Math.max(0, Math.min(n-1, Math.round((p.x - c.L)/((c.W-c.L-c.R)/(n-1)))));
    const xh = svg.querySelector('.xhair'); xh.setAttribute('x1', c.x(i)); xh.setAttribute('x2', c.x(i)); xh.style.display='block';
    showTip(`<div class="k">${esc((c.xLabel?c.xLabel+' ':'')+String(c.xs[i]))}</div>` + c.series.map(s=>`<div><i style="background:var(--${s.cls})"></i>${esc(s.name)} <b>${esc(String(s.values[i]==null?'–':c.fmt(fmtNum(s.values[i]))))}</b></div>`).join(''), ev);
    return;
  }
  const t = ev.target.closest && ev.target.closest('[data-tip]');
  if(t) showTip(t.dataset.tip, ev); else hideTip();
});
// bar helper: 4px rounded data-end, square at the baseline
function barPath(x, yTop, w, base, r=4){ const h = base - yTop; if(h<=0) return ''; r = Math.min(r, h, w/2);
  return `M${x},${base}V${yTop+r}Q${x},${yTop} ${x+r},${yTop}H${x+w-r}Q${x+w},${yTop} ${x+w},${yTop+r}V${base}Z`; }
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function fmtNum(v){ return Math.abs(v)>=1000 ? (v/1000).toFixed(v>=10000?0:1)+'k' : String(Math.round(v*10)/10); }

/* ---------- overview ---------- */
function tally(key){
  const t = {};
  M.forEach(m=>{ const k=key(m); (t[k] ||= [0,0]); if(m.result==='Win') t[k][0]++; else if(m.result==='Loss') t[k][1]++; });
  return Object.entries(t).sort((a,b)=>(b[1][0]+b[1][1])-(a[1][0]+a[1][1]) || a[0].localeCompare(b[0]));
}
function wrTable(title, rows, label){
  return `<div class="panel"><h3>${esc(title)}</h3><table><thead><tr><th>${esc(label)}</th><th class="num">W</th><th class="num">L</th><th>Win rate</th></tr></thead><tbody>
    ${rows.map(([k,[w,l]])=>`<tr><td>${esc(k)}</td><td class="num">${w}</td><td class="num">${l}</td><td style="white-space:nowrap"><span class="bar"><span style="width:${pct(w,l)}%"></span></span>${pct(w,l)}%</td></tr>`).join('')}
    </tbody></table></div>`;
}
function renderOverview(){
  if(!M.length){ $('#tab-overview').innerHTML='<div class="panel empty">No games yet.</div>'; return; }
  const chrono = M.slice().reverse();
  let w=0,l=0; const cum=[], roll=[];
  chrono.forEach((m,i)=>{ if(m.result==='Win') w++; else if(m.result==='Loss') l++; cum.push(pct(w,l));
    const win=chrono.slice(Math.max(0,i-9),i+1); roll.push(pct(win.filter(x=>x.result==='Win').length, win.filter(x=>x.result==='Loss').length)); });
  const xs = chrono.map((_,i)=>i+1);
  const trend = lineChart({title:'Win rate over time (%)', xs, xLabel:'Game', fmt:v=>v+'%', series:[{name:'Overall',cls:'me',values:cum},{name:'Last 10 games',cls:'opp',values:roll}]});

  // game length by result
  const buckets=[[1,6],[7,10],[11,14],[15,18],[19,24],[25,999]];
  const bl = b => b[1]>=999 ? `${b[0]}+` : `${b[0]}–${b[1]}`;
  const bw = buckets.map(b=>chrono.filter(m=>m.result==='Win' && m.turns>=b[0] && m.turns<=b[1]).length);
  const bL = buckets.map(b=>chrono.filter(m=>m.result==='Loss' && m.turns>=b[0] && m.turns<=b[1]).length);
  const mx = Math.max(1,...bw,...bL), BW=520, BH=180, bwid=(BW-40)/buckets.length;
  const bw24 = Math.min(24, (bwid-12)/2);
  let bars = `<line class="grid" x1="20" x2="${BW-10}" y1="${BH-24}" y2="${BH-24}"/>` + buckets.map((b,i)=>{ const cx=30+i*bwid+bwid/2, h1=(BH-44)*bw[i]/mx, h2=(BH-44)*bL[i]/mx;
    return `<path class="bar-win" d="${barPath(cx-bw24-1, BH-24-h1, bw24, BH-24)}" data-tip="<b>${bw[i]}</b> win${bw[i]===1?'':'s'} in ${bl(b)} turns"/>
            <path class="bar-loss" d="${barPath(cx+1, BH-24-h2, bw24, BH-24)}" data-tip="<b>${bL[i]}</b> loss${bL[i]===1?'':'es'} in ${bl(b)} turns"/>
            <text x="${cx}" y="${BH-6}" text-anchor="middle">${bl(b)}</text>`; }).join('');
  const lengthChart = `<div class="chart" style="background:var(--panel);border:1px solid var(--line)"><h3>Game length (turns) by result</h3>
    <div class="legend"><span><i style="background:var(--win-bar,var(--me))"></i>Wins</span><span><i style="background:var(--opp)"></i>Losses</span></div>
    <svg viewBox="0 0 ${BW} ${BH}">${bars}</svg></div>`;

  // opponent cards most seen in losses
  const lossCards = {};
  M.filter(m=>m.result==='Loss').forEach(m=>{ new Set((m.plays||[]).filter(p=>p.side==='opp'&&p.k==='spell').map(p=>p.g)).forEach(g=>lossCards[g]=(lossCards[g]||0)+1); });
  const topLoss = Object.entries(lossCards).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const lossTable = `<div class="panel"><h3>Opponent spells seen most in your losses</h3><table><thead><tr><th>Card</th><th class="num">Losses</th></tr></thead><tbody>
    ${topLoss.map(([g,n])=>{const c=card(g);return `<tr data-g="${g}"><td>${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(c.name)}</a>`:esc(c.name)} <small style="color:var(--muted)">${esc(c.type)}</small></td><td class="num">${n}</td></tr>`;}).join('') || '<tr><td colspan="2" class="empty">No losses recorded.</td></tr>'}
    </tbody></table></div>`;

  // your most-cast spells in wins vs losses
  const mine = {};
  M.forEach(m=>{ new Set((m.plays||[]).filter(p=>p.side==='me'&&p.k==='spell').map(p=>p.g)).forEach(g=>{ (mine[g] ||= [0,0]); if(m.result==='Win') mine[g][0]++; else if(m.result==='Loss') mine[g][1]++; }); });
  const mineRows = Object.entries(mine).filter(([,v])=>v[0]+v[1]>=2).sort((a,b)=>pct(b[1][0],b[1][1])-pct(a[1][0],a[1][1]) || (b[1][0]+b[1][1])-(a[1][0]+a[1][1]));
  const mineTable = wrTable('Your cards: win rate when cast (2+ games)', mineRows.map(([g,v])=>[card(g).name,v]), 'Card');

  $('#tab-overview').innerHTML = `
    <div class="panel" style="padding:0;border:0;background:none">${trend}</div>
    ${lengthChart}
    ${wrTable('By opponent commander', tally(m=>m.opp_cmd), 'Commander')}
    ${wrTable('By opponent colours', tally(m=>m.opp_colors), 'Colours')}
    ${wrTable('By your commander', tally(m=>m.my_cmd), 'Commander')}
    ${wrTable('By event', tally(m=>m.event_name), 'Event')}
    ${wrTable('On the play vs draw', tally(m=>m.on_play?'On the play':'On the draw'), 'Start')}
    ${lossTable}
    ${mineTable}`;
  $('#tab-overview').insertAdjacentHTML('afterbegin', extraOverview2() + lessonsHtml() + seasonHtml() + seasonsTable() + ratingsHtml() + mulliganHtml() + patternsHtml() + metaHtml() + modelOverview() + decisionsOverview() + feedbackOverview() + tiltOverview() + playReviewOverview() + attackOverview() + overview3()
    + wrTable('By opponent archetype', tally(m=>archetype(m)), 'Archetype') + stuckOverview() + curveHtml() + highlightsHtml() + stopLossHtml());
  document.querySelectorAll('.hlbtn').forEach(b=>b.onclick=()=>exportGame(M.find(m=>m.match_id===b.dataset.id)));
  renderGoal();
  $('#tab-overview').insertAdjacentHTML('beforeend', extraOverview());
  chapterize($('#tab-overview'));
}

/* ---------- v3: shared helpers ---------- */
const typeOf = g => card(g).type || '';
const isLand = g => /\bLand\b/.test(typeOf(g)) && !/Creature/.test(typeOf(g));
const RANKS = ['Bronze','Silver','Gold','Platinum','Diamond','Mythic'];
function rankVal(r){ if(!r || !r.class) return null; const i = RANKS.indexOf(r.class); if(i<0) return null;
  return r.class==='Mythic' ? i*4 : i*4 + (4-(r.level||4)) + (r.step||0)/6; }
function rankLabel(r){ if(!r || !r.class) return '–'; return r.class==='Mythic' ? 'Mythic' : `${r.class} ${r.level}`; }
function link(g){ const c = card(g); const n = esc(c.name);
  return `<span data-g="${g}">${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener" style="color:inherit">${n}</a>` : n}</span>`; }
function cardImg(g, cls='hand'){ const c = card(g);
  return c.img ? `<img loading="lazy" src="${esc(c.img)}" alt="${esc(c.name)}" data-g="${g}">` : `<div class="nm" data-g="${g}">${esc(c.name)}</div>`; }
function topN(obj, n=10){ return Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n); }
function simpleTable(title, head, rows, empty='Not enough data yet.'){
  return `<div class="panel"><h3>${esc(title)}</h3>${rows.length ? `<table><thead><tr>${head.map((h,i)=>`<th class="${i?'num':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'num':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>` : `<div class="empty">${esc(empty)}</div>`}</div>`;
}
const winsLosses = arr => [arr.filter(m=>m.result==='Win').length, arr.filter(m=>m.result==='Loss').length];
const wrCell = ([w,l]) => `<span style="white-space:nowrap"><span class="bar"><span style="width:${pct(w,l)}%"></span></span>${pct(w,l)}%</span>`;

/* ---------- v3: game detail extras ---------- */
function extraDetail(m){
  if(!m.hands && !m.board) return '<div class="empty">Recorded before the extra stats were added.</div>';
  let h = '';
  // deck + rank
  const d = m.deck || {};
  const rb = m.rank_before, ra = m.rank_after;
  const rankTxt = ra ? `${rankLabel(rb)} → <b>${rankLabel(ra)}</b>${ra.step!=null && ra.class!=='Mythic' ? ` (${ra.step} pips)` : ''}` : rankLabel(rb);
  h += `<div class="tiles" style="margin-top:14px">
    <div class="tile"><span>Deck</span><b>${esc(d.name||'Unknown')}</b> <span style="display:inline" class="small">${d.hash?esc(versionName(d.hash)):''}</span></div>
    <div class="tile"><span>Rank</span><b>${rankTxt}</b></div>
    <div class="tile"><span>Your commander</span><b>cast ${m.cmd?.me?.casts?.length||0}× · died ${m.cmd?.me?.deaths||0}×</b>
      <span class="small">${m.cmd?.me?.casts?.length ? 'first cast turn '+m.cmd.me.casts[0] : 'never cast'}</span></div>
    <div class="tile"><span>Their commander</span><b>cast ${m.cmd?.opp?.casts?.length||0}× · died ${m.cmd?.opp?.deaths||0}×</b>
      <span class="small">${m.cmd?.opp?.casts?.length ? 'first cast turn '+m.cmd.opp.casts[0] : 'never cast'}</span></div>
  </div>`;

  // opening hand
  const kept = m.kept || [];
  if(kept.length){
    const lands = kept.filter(isLand).length;
    h += `<h3 class="sec">Opening hand <span class="small" style="text-transform:none;letter-spacing:0">· kept ${kept.length} cards, ${lands} land${lands===1?'':'s'}${m.mulligans?` after ${m.mulligans} mulligan${m.mulligans>1?'s':''}`:''}</span></h3>
      <div class="hand">${kept.map(g=>cardImg(g)).join('')}</div>`;
    (m.hands||[]).slice(0,-1).forEach((hand,i)=>{
      h += `<div class="small" style="margin-top:6px">Mulliganed hand ${i+1} (${hand.filter(isLand).length} lands): ${hand.map(link).join(', ')}</div>`;
    });
  }

  // replay
  const turns = Object.keys(m.board||{}).map(Number).sort((a,b)=>a-b);
  if(turns.length){
    h += `<h3 class="sec">Board replay</h3><div class="replay" id="replay">
      <input type="range" id="rturn" min="0" max="${turns.length-1}" value="${turns.length-1}">
      <div id="rbody"></div></div>`;
  }

  // damage
  const dm = m.damage || {};
  const dmgRows = side => topN((dm[side]||{}).to_player||{}, 8).map(([g,v])=>[link(g), v]);
  const dmgC = side => topN((dm[side]||{}).to_creature||{}, 5).map(([g,v])=>[link(g), v]);
  h += `<h3 class="sec">Damage</h3><div class="cols2">
    ${simpleTable(`Your damage to them · ${dm.me?.combat||0} combat, ${dm.me?.noncombat||0} other`, ['Source','Dmg'], dmgRows('me'), 'You dealt no damage to them.')}
    ${simpleTable(`Their damage to you · ${dm.opp?.combat||0} combat, ${dm.opp?.noncombat||0} other`, ['Source','Dmg'], dmgRows('opp'), 'They dealt no damage to you.')}
    ${simpleTable('Your damage to their creatures', ['Source','Dmg'], dmgC('me'), 'None.')}
    ${simpleTable('Their damage to your creatures', ['Source','Dmg'], dmgC('opp'), 'None.')}
  </div>`;

  // removals
  const rem = m.removals || [];
  const remRows = side => rem.filter(r=>r.side===side).map(r=>[`T${r.t}`, link(r.g), esc(r.how), r.by ? link(r.by) : '<span class="small">–</span>']);
  h += `<h3 class="sec">What died or left the battlefield</h3><div class="cols2">
    ${tableL('Your permanents', ['Turn','Card','How','Caused by'], remRows('me'))}
    ${tableL('Their permanents', ['Turn','Card','How','Caused by'], remRows('opp'))}
  </div>`;

  // draws
  const draws = m.draws || [];
  if(draws.length){
    const cast = new Set((m.plays||[]).filter(p=>p.side==='me').map(p=>p.g));
    const byT = {};
    draws.forEach(([t,g])=>(byT[t] ||= []).push(g));
    const unused = draws.filter(([t,g])=>!cast.has(g) && !isLand(g)).map(([t,g])=>g);
    h += `<h3 class="sec">Your draws <span class="small" style="text-transform:none;letter-spacing:0">· ${draws.length} cards · ${unused.length} spell${unused.length===1?'':'s'} drawn but never cast</span></h3>

let VERSIONS = [];
function buildVersions(){
  const seen = {}; VERSIONS = [];
  M.slice().reverse().forEach(m=>{ const d = m.deck || {}; if(!d.hash || seen[d.hash]) return;
    seen[d.hash] = VERSIONS.length+1; VERSIONS.push({hash:d.hash, name:d.name, cards:d.cards||[], first:m.date}); });
}
function versionName(hash){ const i = VERSIONS.findIndex(v=>v.hash===hash); return i<0 ? '' : `v${i+1}`; }
function diffCards(a, b){
  const ca = {}, cb = {}; a.forEach(g=>ca[g]=(ca[g]||0)+1); b.forEach(g=>cb[g]=(cb[g]||0)+1);
  const added = [], removed = [];
  new Set([...Object.keys(ca),...Object.keys(cb)]).forEach(g=>{ const d=(cb[g]||0)-(ca[g]||0);
    for(let i=0;i<Math.abs(d);i++) (d>0?added:removed).push(g); });
  return {added, removed};
}

/* ---------- v4: mana problems ---------- */
function manaIssue(m){
  const b = m.board || {}, tl = m.timeline || [];
  const myTurns = tl.filter(t=>t.a==='me').map(t=>t.t);
  if(!myTurns.length || !Object.keys(b).length) return null;
  const landsAt = t => (b[t]?.me||[]).filter(p=>p[4]).length;
  const at = i => myTurns[Math.min(i, myTurns.length-1)];
  // land-screw: under 3 lands on your 4th turn, or under 4 on your 6th
  if((myTurns.length>=4 && landsAt(at(3))<3) || (myTurns.length>=6 && landsAt(at(5))<4))
    return {kind:'Screwed', why:`only ${landsAt(at(Math.min(5,myTurns.length-1)))} lands by your turn ${Math.min(6,myTurns.length)}`};
  // colour-screw: from your 3rd turn, holding a spell of a colour none of your lands make
  for(const t of myTurns.slice(2,8)){
    const lands = (b[t]?.me||[]).filter(p=>p[4]).map(p=>card(p[0]));
    const make = new Set(lands.flatMap(c=>(c.produces||c.colors||'').split('')));
    if(!lands.length) continue;
    const stuck = (b[t]?.hand||[]).map(card).filter(c=>!/Land/.test(c.type||'') && c.mana && [...'WUBRG'].some(col=>c.mana.includes('{'+col+'}') && !make.has(col)));
    const cols = [...new Set(stuck.flatMap(c=>[...'WUBRG'].filter(col=>c.mana.includes('{'+col+'}') && !make.has(col))))];
    if(stuck.length && cols.length) return {kind:'Colour-screwed', why:`no ${cols.map(c=>({W:'white',U:'blue',B:'black',R:'red',G:'green'})[c]).join('/')} source on turn ${t} while holding ${stuck.map(c=>c.name).slice(0,2).join(', ')}`};
  }
  // flood: from your 6th turn, hand of 3+ cards that's mostly lands, or 9+ lands out with an empty hand
  for(const t of myTurns.slice(5)){
    const hand = (b[t]?.hand||[]).map(card), lh = hand.filter(c=>/Land/.test(c.type||'') && !/Creature/.test(c.type||'')).length;
    if((hand.length>=3 && lh/hand.length>=0.67) || (landsAt(t)>=9 && hand.length<=1)) return {kind:'Flooded', why:`turn ${t}: ${landsAt(t)} lands out, ${lh} of ${hand.length} cards in hand are lands`};
  }
  return {kind:'OK', why:'mana looked fine'};
}

async function exportGame(m){

  const [a1, a2] = await Promise.all([loadImg(card(m.my_commanders?.[0]).art), loadImg(card(m.opp_commanders?.[0]).art)]);
  const art = (img, X, Y, w, h, label, sub, tint) => { x.save(); x.beginPath(); x.roundRect(X,Y,w,h,14); x.clip();
    if(img){ const r = Math.max(w/img.width, h/img.height); x.drawImage(img, X+(w-img.width*r)/2, Y+(h-img.height*r)/2, img.width*r, img.height*r); } else { x.fillStyle = col('soft'); x.fillRect(X,Y,w,h); }

function cutRanking(deck){
  const overall = winsLosses(M), base = pct(...overall)/100, stats = {};
  M.forEach(m=>{ const cast = new Set((m.plays||[]).filter(p=>p.side==='me').map(p=>p.g));
    new Set((m.draws||[]).map(d=>d[1]).concat(m.kept||[])).forEach(g=>{ if(!deck.includes(g) || isLand(g)) return;
      const st = (stats[g] ||= {seen:0,cast:0,w:0,l:0}); st.seen++; if(cast.has(g)) st.cast++;
      if(m.result==='Win') st.w++; else if(m.result==='Loss') st.l++; }); });
  return Object.entries(stats).filter(([,v])=>v.seen>=2).map(([g,v])=>{

    let out = planned || PLAN_OUT[c], why = planned ? 'from your upgrade plan' : 'from your Mythic plan';
    if(out && protect.has(out)) out = null;
    if(out && BASICS.has(out) && names.has(out)){ plan[c] = {out, g: names.get(out), why}; return; }
    if(!out || !names.has(out) || used.has(out)){
      out = null;
      if(LAND_UPGRADES.has(c)){
        out = TAPLANDS.find(t=>names.has(t) && !used.has(t)) || null;
        why = 'your weakest remaining tapped land';
        if(!out){ out = 'a basic land'; why = 'no taplands left'; }
      } else {
        const pick = ranking.find(r=>{ const n = card(r.g).name.split(' // ')[0]; return !used.has(n) && !protect.has(n); });
        if(pick){ out = card(pick.g).name; why = `weakest card in your games: ${pick.why}`; }
      }
    }
    if(out){ used.add(out); plan[c] = {out, g: names.get(out), why}; }
  }));
  return plan;
}

/* ---------- v8: matchup game plan ---------- */
function gamePlan(games){
  const lines = [];
  const cmdTurns = games.map(m=>m.cmd?.opp?.casts?.[0]).filter(x=>x!=null);
  const avgCmd = cmdTurns.length ? cmdTurns.reduce((a,b)=>a+b,0)/cmdTurns.length : null;
  const deck = currentDeckIds();
  const ansCards = [...new Set(deck)].filter(g=>(card(g).roles||[]).includes('interaction'));
  const counters = ansCards.filter(g=>/counter target/i.test(card(g).oracle||''));
  if(avgCmd!=null) lines.push(`They usually cast their commander around <b>turn ${Math.round(avgCmd)}</b>${counters.length?` — keep mana up for ${counters.slice(0,3).map(link).join(', ')} on turn ${Math.max(1,Math.round(avgCmd))}`:''}.`);
  const harm = {}; games.forEach(m=>(m.interaction?.let_through||[]).forEach(x=>harm[x.g]=(harm[x.g]||0)+x.harm));
  const top = topN(harm,3);
  if(top.length) lines.push(`Their biggest threats to you: ${top.map(([g])=>link(g)).join(', ')}. Save your removal for these rather than small creatures.`);
  const flyers = games.flatMap(m=>(m.plays||[]).filter(p=>p.side==='opp'&&/flying/.test((card(p.g).kw||[]).join(' '))).map(p=>p.g));
  if(flyers.length>=2) lines.push(`They play fliers (${[...new Set(flyers)].slice(0,3).map(link).join(', ')}) — you can't block these well, so plan to race or hold Crushing Canopy / Bite Down.`);
  const avgT = games.reduce((s,m)=>s+(m.turns||0),0)/games.length;
  const wins = games.filter(m=>m.result==='Win'), losses = games.filter(m=>m.result==='Loss');
  if(wins.length && losses.length){
    const aw = wins.reduce((s,m)=>s+m.turns,0)/wins.length, al = losses.reduce((s,m)=>s+m.turns,0)/losses.length;
    lines.push(aw < al ? `You win the <b>faster</b> games here (wins avg ${aw.toFixed(0)} turns vs losses ${al.toFixed(0)}) — be the aggressor.` : `You win the <b>longer</b> games here (wins avg ${aw.toFixed(0)} turns vs losses ${al.toFixed(0)}) — don't overextend early, play for the late game.`);
  } else lines.push(`Games average ${avgT.toFixed(0)} turns.`);
  const zw = wins.map(m=>m.cmd?.me?.casts?.[0]).filter(x=>x!=null);
  if(zw.length) lines.push(`In your wins, your commander landed around turn ${Math.round(zw.reduce((a,b)=>a+b,0)/zw.length)}.`);
  return `<div class="panel" style="margin-bottom:14px"><h3>Game plan</h3><ul style="margin:0;padding-left:18px;line-height:1.7">${lines.map(l=>`<li>${l}</li>`).join('')}</ul>
    <div class="small" style="margin-top:6px">Built from ${games.length} game${games.length>1?'s':''} against this commander — gets sharper the more you face it.</div></div>`;
}

/* ---------- 2. opponent archetypes ---------- */
function archetype(m){
  const spells = (m.plays||[]).filter(p=>p.side==='opp' && p.k==='spell');
  if(spells.length < 3) return 'Unknown';
  const avg = spells.reduce((s,p)=>s+cmcOf(p.g),0)/spells.length;
  const cre = spells.filter(p=>/Creature/.test(card(p.g).type||'')).length/spells.length;
  const inter = spells.filter(p=>rolesOf(p.g).includes('interaction')).length/spells.length;
  const ramp = spells.filter(p=>rolesOf(p.g).includes('ramp')).length;
  const tl = m.timeline||[], early = tl.find(t=>t.t>=8) || tl[tl.length-1];
  const earlyDmg = 25 - (early?.me?.life ?? 25);
  const oppLands = Math.max(0,...tl.filter(t=>t.t<=10).map(t=>t.opp?.lands||0)), myLands = Math.max(0,...tl.filter(t=>t.t<=10).map(t=>t.me?.lands||0));
  if(avg <= 2.8 && cre >= 0.5 && earlyDmg >= 6) return 'Aggro';
  if(inter >= 0.35 && cre <= 0.4) return 'Control';
  if(ramp >= 3 || oppLands >= myLands + 3) return 'Ramp';
  const tutors = spells.filter(p=>/search your library for a(n)? (card|instant|sorcery|creature|artifact|enchantment)/i.test(card(p.g).oracle||'')).length;
  if(tutors >= 2) return 'Combo';
  return 'Midrange';
}

function handVerdict(hand){
  const f = {lands:0, ramp:0, interaction:0, cheap:0, draw:0};
  hand.forEach(g=>{ if(isLand(g)){ f.lands++; return; } const r = rolesOf(g);
    ['ramp','interaction','draw'].forEach(k=>{ if(r.includes(k)) f[k]++; }); if(cmcOf(g)<=2) f.cheap++; });
  const n = f.lands;
  const v = n<=1||n>=6 ? 'MULLIGAN' : n===2 ? (f.ramp||f.cheap>=2 ? 'KEEP' : 'RISKY') : n===5 ? (f.ramp||f.draw?'KEEP':'CLOSE CALL') : 'KEEP';
  return {f, v};
}

  const histR = M.filter(m=>m.hand_f && m.hand_f.lands===f.lands && !!m.hand_f.ramp===!!f.ramp), hr = winsLosses(histR);
  const score = practice.log.length ? `${practice.log.filter(x=>x.agree).length}/${practice.log.length} decisions matched the advice` : '';
  box.innerHTML = `<div class="panel"><h3>Mulligan practice <span class="small" style="text-transform:none;letter-spacing:0">${score}</span></h3>
    <div class="hand" style="margin:8px 0 12px">${practice.hand.map(g=>cardImg(g)).join('')}</div>
    <div>${f.lands} land${f.lands===1?'':'s'} · ${f.ramp} ramp · ${f.interaction} interaction · ${f.cheap} plays ≤2 mana</div>
    ${practice.shown ? `<div style="margin-top:10px"><b>Advice: ${v}</b> · your kept ${f.lands}-land hands: ${hl[0]}–${hl[1]}${hl[0]+hl[1]?` (${pct(...hl)}%)`:''} · with${f.ramp?'':'out'} ramp: ${hr[0]}–${hr[1]}</div>
      <div class="small" style="margin-top:6px">Your next 4 draws would have been:</div><div class="hand" style="margin-top:4px">${practice.lib.slice(0,4).map(g=>cardImg(g)).join('')}</div>
      <button class="toggle" style="float:none;margin-top:12px" id="pdraw">Next hand</button>`
    : `<div style="margin-top:12px;display:flex;gap:8px"><button class="toggle" style="float:none" id="pkeep">Keep</button><button class="toggle" style="float:none" id="pmull">Mulligan</button></div>`}
  </div>`;
  const choose = keep => { practice.log.push({agree: (keep ? v!=='MULLIGAN' : v==='MULLIGAN' || v==='RISKY')}); practice.shown = true; renderPractice(); };
  if(practice.shown) $('#pdraw').onclick = newHand; else { $('#pkeep').onclick = ()=>choose(true); $('#pmull').onclick = ()=>choose(false); }
}

/* ---------- 4. session highlights ---------- */
function sessionsList(){
  const chrono = M.slice().reverse(), sessions = [];
  chrono.forEach(m=>{ const s = sessions[sessions.length-1];
    if(!s || m.start - s.end > 45*60*1000) sessions.push({games:[m], start:m.start, end:m.end}); else { s.games.push(m); s.end = m.end; } });
  return sessions;
}
function highlightOf(s){
  let best = null;
  s.games.forEach(m=>{ const tl = m.timeline||[];
    tl.forEach((t,i)=>{ if(!i || t.a!=='me') return; const d = (tl[i-1].opp?.life??0) - (t.opp?.life??0);
      const lethal = m.result==='Win' && i===tl.length-1 || (t.opp?.life??1) <= 0;
      const sc = d + (lethal ? 15 : 0);
      if(d>0 && (!best || sc > best.sc)) best = {sc, m, t:t.t, d, lethal, power: t.me?.biggest||0}; }); });
  return best;
}
function highlightsHtml(){
  const ss = sessionsList().reverse().slice(0,8);
  const rows = ss.map((s,i)=>{ const h = highlightOf(s); if(!h) return null;
    return `<tr><td class="small" style="white-space:nowrap">${esc(s.games[0].date)}</td><td>${h.lethal?'💀 <b>Lethal</b>':'💥 Big swing'}: ${h.d} damage on turn ${h.t} vs ${esc(h.m.opp_cmd)}${h.power>=10?` · biggest creature ${fmtNum(h.power)}`:''}</td>
      <td><button class="toggle hlbtn" style="float:none" data-id="${h.m.match_id}">Save image</button></td></tr>`; }).filter(Boolean);
  return `<div class="panel"><h3>Session highlights</h3>${rows.length?`<table><tbody>${rows.join('')}</tbody></table>`:'<div class="empty">No highlights yet.</div>'}</div>`;
}

/* ---------- 5. curve & colours ---------- */
function curveHtml(){
  const deck = currentDeckIds(); if(!deck.length) return '';
  const nonland = deck.filter(g=>!isLand(g));
  const buckets = [0,1,2,3,4,5,6,7]; const cnt = buckets.map(b=>nonland.filter(g=>Math.min(7,Math.round(cmcOf(g)))===b).length);
  // on-curve: cast on (or before) your turn number = its cost
  const onC = buckets.map(()=>[0,0]);
  M.forEach(m=>{ const idx = myTurnIndex(m); (m.plays||[]).filter(p=>p.side==='me'&&p.k==='spell').forEach(p=>{ const c = Math.min(7,Math.round(cmcOf(p.g))); const tn = idx[p.t]; if(!tn || c<1) return; onC[c][1]++; if(tn<=c) onC[c][0]++; }); });
  const mx = Math.max(1,...cnt), W=520, H=170, bw=(W-40)/buckets.length;
  const bars = `<line class="grid" x1="20" x2="${W-10}" y1="${H-24}" y2="${H-24}"/>` + buckets.map((b,i)=>{ const h=(H-44)*cnt[i]/mx, cx=30+i*bw+bw/2, w=Math.min(24,bw-12);
    return `<path class="bar-me" d="${barPath(cx-w/2, H-24-h, w, H-24)}" data-tip="<b>${cnt[i]}</b> card${cnt[i]===1?'':'s'} costing ${b}${b===7?'+':''}"/>
      <text x="${cx}" y="${H-24-h-6}" text-anchor="middle" class="endlab">${cnt[i]||''}</text><text x="${cx}" y="${H-6}" text-anchor="middle">${b}${b===7?'+':''}</text>`; }).join('');
  // colour shortfalls: holding an affordable spell you couldn't cast for colour
  const short = {U:0, G:0, W:0, B:0, R:0}; let turnsChecked = 0;
  M.forEach(m=>{ const b = m.board||{}; (m.timeline||[]).filter(t=>t.a==='me').forEach(t=>{ const bb = b[t.t]; if(!bb) return; turnsChecked++;
    const lands = (bb.me||[]).filter(p=>p[4]).length, have = landColours(bb.me);
    const miss = new Set(); (bb.hand||[]).forEach(g=>{ if(isLand(g) || cmcOf(g)>lands) return; colourNeeds(g).forEach(c=>{ if(!have.has(c)) miss.add(c); }); });
    miss.forEach(c=>short[c]++); }); });
  const colRows = Object.entries(short).filter(([,n])=>n).map(([c,n])=>[{U:'Blue',G:'Green',W:'White',B:'Black',R:'Red'}[c], n, `${Math.round(100*n/Math.max(1,turnsChecked))}% of your turns`]);
  return `<div class="chart" style="background:var(--panel);border:1px solid var(--line)"><h3>Your mana curve (current deck, non-land)</h3><svg viewBox="0 0 ${W} ${H}">${bars}</svg></div>` +
    simpleTable('Cast on curve (on or before the turn matching its cost)', ['Cost','Cast','On curve','Rate'], buckets.slice(1).filter(b=>onC[b][1]).map(b=>[b+(b===7?'+':''), onC[b][1], onC[b][0], `${Math.round(100*onC[b][0]/onC[b][1])}%`])) +
    simpleTable('Turns you were short of a colour', ['Colour','Turns','How often'], colRows, 'No colour problems recorded.');
}

/* ---------- 6. stop-loss ---------- */
function stopLossHtml(){
  const ss = sessionsList(); const early = [], late = [];
  ss.forEach(s=>s.games.forEach((m,i)=>(i<3?early:late).push(m)));
  const e = winsLosses(early), l = winsLosses(late);
  if(e[0]+e[1] < 5 || l[0]+l[1] < 5) return `<div class="panel"><h3>Session stop point</h3><div class="small">Needs a few longer sessions (4+ games) before it can tell whether you play worse late in a session.</div></div>`;
  const drop = pct(...e) - pct(...l);
  // find the game number after which win rate falls the most
  const by = {}; ss.forEach(s=>s.games.forEach((m,i)=>(by[i+1] ||= []).push(m)));
  let suggest = null;
  for(let k=3;k<=8;k++){ const before = Object.entries(by).filter(([n])=>+n<=k).flatMap(([,a])=>a), after = Object.entries(by).filter(([n])=>+n>k).flatMap(([,a])=>a);
    if(winsLosses(after).reduce((a,b)=>a+b,0) < 4) break;
    const d = pct(...winsLosses(before)) - pct(...winsLosses(after)); if(d >= 15 && (!suggest || d > suggest.d)) suggest = {k, d}; }
  return `<div class="panel"><h3>Session stop point</h3>
    <div>Games 1–3 of a session: <b>${pct(...e)}%</b> (${e[0]}–${e[1]}) · game 4 onwards: <b>${pct(...l)}%</b> (${l[0]}–${l[1]})</div>
    <div style="margin-top:6px">${suggest ? `Your win rate drops by about ${suggest.d} points after game <b>${suggest.k}</b> — that's a good place to take a break.` : drop >= 15 ? 'You do a bit worse late in sessions — consider shorter sessions.' : "No sign you play worse late in a session — keep going while you're enjoying it."}</div></div>`;
}


/* ---------- at a glance: the findings that matter ---------- */
function compare(a, b){ const wa = winsLosses(a), wb = winsLosses(b); return {pa:pct(...wa), pb:pct(...wb), na:wa[0]+wa[1], nb:wb[0]+wb[1]}; }
function insights(){
  const out = [];
  const add = (score, o) => { if(isFinite(score)) out.push({score, ...o}); };
  const withCmd = M.filter(m=>m.cmd && m.cmd.me.casts.length);
  // who you keep running into this week
  { const wk = M.filter(m=>Date.now()-m.start < 7*86400000), by = {}; wk.forEach(m=>(by[m.opp_cmd] ||= []).push(m));
    const top = Object.entries(by).sort((a,b)=>b[1].length-a[1].length)[0];
    if(top && top[1].length>=3){ const w = winsLosses(top[1]); add(30 + top[1].length*3, {big:'×'+top[1].length, tone: w[0]>=w[1]?'good':'bad', ch:'opponents',
      text:`you've faced <b style="display:inline;font-size:inherit;color:inherit">${esc(top[0])}</b> this week (${w[0]}–${w[1]}). Check the Matchups tab for a plan.`}); } }
  // commander survival
  { const c = compare(withCmd.filter(m=>!m.cmd.me.deaths), withCmd.filter(m=>m.cmd.me.deaths>0));
    if(c.na>=4 && c.nb>=4) add(Math.abs(c.pa-c.pb), {big:c.pa+'%', tone:'good', ch:'commander',
      text:`win rate when your commander survives, vs <b style="display:inline;font-size:inherit;color:inherit">${c.pb}%</b> when it dies. Protecting it is your biggest lever.`}); }
  // commander timing
  { const early = withCmd.filter(m=>m.cmd.me.casts[0]<=8), late = withCmd.filter(m=>m.cmd.me.casts[0]>8); const c = compare(early, late);
    if(c.na>=4 && c.nb>=4) add(Math.abs(c.pa-c.pb)*.9, {big:c.pa+'%', tone:c.pa>=c.pb?'good':'bad', ch:'commander',
      text:`win rate when your commander lands by turn 8, vs ${c.pb}% when it lands later.`}); }
  // hands
  { const g = {}; M.filter(m=>m.hand_f).forEach(m=>{ const k = `${m.hand_f.lands} land${m.hand_f.lands===1?'':'s'}${m.hand_f.ramp?' + ramp':''}`; (g[k] ||= []).push(m); });
    const rows = Object.entries(g).map(([k,a])=>({k, n:a.length, p:pct(...winsLosses(a))})).filter(r=>r.n>=5).sort((a,b)=>b.p-a.p);
    if(rows.length>=2){ const best = rows[0], worst = rows[rows.length-1];
      add((best.p-worst.p)*.8, {big:best.p+'%', tone:'good', ch:'openings', text:`win rate keeping <b style="display:inline;font-size:inherit;color:inherit">${esc(best.k)}</b> (${best.n} games). Your weakest keep is ${esc(worst.k)} at ${worst.p}%.`}); } }
  // deck version
  if(VERSIONS.length>=2){ const cur = VERSIONS[VERSIONS.length-1], prev = VERSIONS[VERSIONS.length-2];
    const c = compare(M.filter(m=>m.deck?.hash===cur.hash), M.filter(m=>m.deck?.hash===prev.hash));
    if(c.na>=4 && c.nb>=3) add(Math.abs(c.pa-c.pb)*.8, {big:c.pa+'%', tone:c.pa>=c.pb?'good':'bad', ch:'deck', text:`win rate with your current deck (${c.na} games), vs ${c.pb}% with the previous version.`}); }
  // play / draw
  { const c = compare(M.filter(m=>m.on_play), M.filter(m=>m.on_play===false));
    if(c.na>=5 && c.nb>=5 && Math.abs(c.pa-c.pb)>=10) add(Math.abs(c.pa-c.pb)*.6, {big:(c.pa>c.pb?c.pa:c.pb)+'%', tone:'good', ch:'opponents',
      text:`win rate on the ${c.pa>c.pb?'play':'draw'}, vs ${c.pa>c.pb?c.pb:c.pa}% on the ${c.pa>c.pb?'draw':'play'}.`}); }
  // toughest opponent type
  { const t = tally(m=>archetype(m)).filter(([k,[w,l]])=>k!=='Unknown' && w+l>=4).map(([k,[w,l]])=>({k,n:w+l,p:pct(w,l)})).sort((a,b)=>a.p-b.p);
    const all = pct(...winsLosses(M));
    if(t.length && all - t[0].p >= 10) add((all-t[0].p)*.7, {big:t[0].p+'%', tone:'bad', ch:'opponents', text:`win rate against <b style="display:inline;font-size:inherit;color:inherit">${esc(t[0].k)}</b> decks (${t[0].n} games), your toughest matchup type.`}); }
  // colours
  { const t = tally(m=>m.opp_colors).filter(([k,[w,l]])=>w+l>=4).map(([k,[w,l]])=>({k,n:w+l,p:pct(w,l)})).sort((a,b)=>a.p-b.p);
    const all = pct(...winsLosses(M));
    if(t.length && all - t[0].p >= 15) add((all-t[0].p)*.6, {big:t[0].p+'%', tone:'bad', ch:'opponents', text:`win rate against <b style="display:inline;font-size:inherit;color:inherit">${esc(t[0].k)}</b> opponents (${t[0].n} games).`}); }
  // attacks
  { const recent = M.slice(0,10), missed = recent.reduce((n,m)=>n+(m.attack_review||[]).filter(x=>x.kind==='missed').length,0);
    if(recent.length>=5 && missed>=3) add(missed*4, {big:String(missed), tone:'bad', ch:'combat', text:`times in your last ${recent.length} games you left free damage on the table or missed lethal.`}); }
  // play review
  { const recent = M.slice(0,10).filter(m=>m.board), n = recent.reduce((k,m)=>k+playReview(m).filter(x=>x.kind!=='mana').length,0);
    if(recent.length>=5 && n>=3) add(n*4, {big:String(n), tone:'bad', ch:'combat', text:`turns in your last ${recent.length} games where the play review suggests a better card or a missed land drop.`}); }
  // activations
  { const g0 = M.filter(m=>m.cmd_uses && !m.cmd_uses.some(u=>u.kind==='activated')), g1 = M.filter(m=>m.cmd_uses && m.cmd_uses.some(u=>u.kind==='activated'));
    const c = compare(g1, g0);
    if(c.na>=3 && c.nb>=5 && c.pa-c.pb>=10) add((c.pa-c.pb)*.7, {big:c.pa+'%', tone:'good', ch:'commander', text:`win rate in games where you activated your commander's ability, vs ${c.pb}% when you didn't (you skip it in ${c.nb} of ${c.na+c.nb} games).`}); }
  // top damage dealer
  { const d = {}; M.forEach(m=>Object.entries(m.damage?.me?.to_player||{}).forEach(([g,v])=>d[g]=(d[g]||0)+v)); const top = topN(d,2);
    if(top.length) add(5, {big:fmtNum(top[0][1]), tone:'', ch:'combat', text:`damage dealt by <span data-g="${top[0][0]}"><b style="display:inline;font-size:inherit;color:inherit">${esc(card(top[0][0]).name)}</b></span>, your top damage dealer${top[1]?`, ahead of ${esc(card(top[1][0]).name)} (${fmtNum(top[1][1])})`:''}.`}); }
  return out.sort((a,b)=>b.score-a.score).slice(0,6);
}
const CH_NAME = {form:'Form', openings:'Openings & mana', deck:'Deck', commander:'Commander', combat:'Combat & interaction', opponents:'Opponents', sessions:'Sessions'};
function glanceHtml(){
  const list = insights();
  if(!list.length) return '';
  return `<section class="glance">${list.slice(0,4).map(i=>`<div class="ins ${i.tone}"><b>${i.big}</b><p>${i.text}</p><a href="#ch-${i.ch}" class="golink">${esc(CH_NAME[i.ch])} details</a></div>`).join('')}</section>`;
}
const PRIMARY = {form:['What decides your games','Season goal'], openings:['Keep or mulligan?','Mana problems'], deck:['Win rate when drawn','Cards to consider cutting'],
  commander:['When your commander landed','Did your commander'], combat:['Decisions and results','Key moments'], opponents:['Trending opponents','By opponent archetype'],
  sessions:['Time of day','Session stop point']};
/* ---------- play review: "I'd have played X instead" ---------- */
function playReview(m){
  const b = m.board||{}, tl = m.timeline||[], out = [];
  if(!tl.length || !Object.keys(b).length) return out;
  const cmdIds = new Set(m.my_commanders||[]), cmdG = (m.my_commanders||[])[0];
  const plays = m.plays||[];
  const myTurns = tl.filter(t=>t.a==='me').map(t=>t.t);
  const tnIdx = {}; myTurns.forEach((t,i)=>tnIdx[t]=i+1);
  const o = g => (card(g).oracle||'').toLowerCase();
  const lifeAt = t => tl.find(x=>x.t===t)?.me?.life;
  let cmdCasts = 0; const said = new Set();
  for(const t of myTurns){
    const bb = b[t], prev = b[t-1] || {me:[], opp:[]};
    const mine = plays.filter(p=>p.t===t && p.side==='me');
    const castNow = mine.filter(p=>p.k==='spell'), landsPlayed = mine.filter(p=>p.k==='land');
    if(!bb){ cmdCasts += castNow.filter(p=>cmdIds.has(p.g)).length; continue; }
    // what you had: end-of-turn hand plus everything you played from it this turn
    const hand = [...(bb.hand||[]), ...mine.filter(p=>!cmdIds.has(p.g)).map(p=>p.g)];
    // what you could pay: lands (minus one that came in tapped) plus mana creatures/rocks already in play
    const lands = (bb.me||[]).filter(p=>p[4]);
    const tappedIn = landsPlayed.some(p=>/enters (the battlefield )?tapped/.test(o(p.g)) && !/you may pay|unless you control/.test(o(p.g)));
    const dorks = (prev.me||[]).filter(p=>!p[4] && (card(p[0]).produces||'') && !/Land/.test(card(p[0]).type||''));
    const mana = lands.length - (tappedIn?1:0) + dorks.length;
    const colours = new Set([...landColours(bb.me), ...dorks.flatMap(p=>(card(p[0]).produces||'').split(''))]);
    const haveCreature = (prev.me||[]).some(p=>p[1]!=null);
    const enemyCreature = (prev.opp||[]).some(p=>p[1]!=null);
    const cost = g => (card(g).cmc||0) + (cmdIds.has(g) ? 2*cmdCasts : 0);
    const castable = g => { const c = card(g); if(isLand(g) || /\{X\}/.test(c.mana||'') || !c.mana) return false;
      return cost(g) <= mana && colourNeeds(g).every(x=>colours.has(x)); };
    const needsMine = g => /its power|fights|target creature you control/.test(o(g)) || (/enchant creature/.test(o(g)) && !/loses all abilities|can't attack|can't block/.test(o(g)));
    const isRamp = g => rolesOf(g).includes('ramp') && !/counter target/.test(o(g));
    const realLand = g => isLand(g) && !/\/\//.test(card(g).type||'');
    const usable = g => castable(g) && !(needsMine(g) && !haveCreature) && !(/its power|fights/.test(o(g)) && !enemyCreature);
    const reactive = g => /Instant/.test(card(g).type||'') || (card(g).kw||[]).includes('flash');
    const spent = castNow.reduce((s,p)=>s+cost(p.g),0)
      + plays.filter(p=>p.t===t+1 && p.side==='me' && p.k==='spell').reduce((s,p)=>s+(card(p.g).cmc||0),0);
    const activated = (m.cmd_uses||[]).some(u=>u.t===t && u.kind==='activated');
    const names = castNow.filter(p=>!cmdIds.has(p.g)).map(p=>card(p.g).name);
    const instead = names.length ? ` instead of ${names.slice(0,2).join(' and ')}` : '';
    const push = (kind, g, text) => out.push({t, n:tnIdx[t], kind, g, text});

    // 1. land drop
    const land = hand.find(g=>realLand(g));
    if(!landsPlayed.length && land && lands.length < 7){ push('land', land, `Missed land drop. You were holding ${card(land).name}.`); }
    // 2. commander ready but not cast
    else if(cmdG && tnIdx[t]<=10 && !(bb.me||[]).some(p=>cmdIds.has(p[0])) && !(prev.me||[]).some(p=>cmdIds.has(p[0]))
            && !castNow.some(p=>cmdIds.has(p.g)) && castable(cmdG) && !activated && !said.has('cmd')
            && !castNow.some(p=>reactive(p.g) || isRamp(p.g) || /destroy target|exile target|fights|its power|counter target|return target/.test(o(p.g)))
            && castNow.reduce((s,p)=>s+cost(p.g),0) < cost(cmdG) && !plays.some(p=>p.t===t+1 && p.side==='me' && p.k==='spell')){
      said.add('cmd');
      push('play', cmdG, `I'd have cast ${card(cmdG).name}${instead}. You had ${mana} mana and the colours for it${cmdCasts?`, including ${2*cmdCasts} tax`:''}.`); }
    // 3. ramp first in the early turns
    else if(tnIdx[t]<=3 && !castNow.some(p=>isRamp(p.g))
            && hand.some(g=>isRamp(g) && usable(g) && !said.has(g))){
      const r = hand.find(g=>isRamp(g) && usable(g) && !said.has(g)); said.add(r);
      push('play', r, `I'd have played ${card(r).name}${instead}. Ramp on your turn ${tnIdx[t]} gets your commander out sooner.`); }
    else {
      // 4. a threat hit you after you held a working answer
      const threat = (prev.opp||[]).filter(p=>p[1]!=null && ((p[1]||0)>=4 || (m.opp_commanders||[]).includes(p[0]))).sort((a,c)=>(c[1]||0)-(a[1]||0))[0];
      const taken = (lifeAt(t) ?? 0) - (lifeAt(t+1) ?? lifeAt(t) ?? 0);
      const answered = castNow.some(p=>rolesOf(p.g).includes('interaction'))
        || plays.some(p=>p.t===t+1 && p.side==='me' && rolesOf(p.g).includes('interaction'));
      const ans = threat && hand.find(g=>usable(g) && !/counter target/.test(o(g))
        && /destroy target (nonland |artifact or )?(creature|permanent)|exile target (nonland )?(creature|permanent)|damage equal to its power to (target|another target)|fights target|return target (nonland )?(creature|permanent)|loses all abilities|target creature[^.]{0,40}becomes a/.test(o(g)));
      if(threat && ans && taken>=5 && !answered){
        push('play', ans, `I'd have used ${card(ans).name} on ${card(threat[0]).name}${instead}. It hit you for ${taken} on their next turn.`); }
      // 5. mana left on the table
      else if(!activated && !(bb.me||[]).some(p=>/Equipment/.test(card(p[0]).type||''))
              && !hand.some(g=>reactive(g) && castable(g) && /counter target|hexproof|indestructible|protection/.test(o(g)))){
        const spare = mana - spent;
        const later = new Set(plays.filter(p=>p.t>t && p.side==='me').map(p=>p.g));
        const opt = hand.filter(g=>usable(g) && !reactive(g) && !castNow.some(p=>p.g===g) && cost(g)<=spare && later.has(g) && !said.has(g))
          .sort((a,c)=>cost(c)-cost(a))[0];
        if(spare>=3 && opt){ said.add(opt); } if(spare>=3 && opt) push('mana', opt, `You left ${spare} mana unused while holding ${card(opt).name} (${cost(opt)} mana).`);
      }
    }
    cmdCasts += castNow.filter(p=>cmdIds.has(p.g)).length;
  }
  return out;
}
