  return {from:w[before], to:w[after], drop:w[before]-w[after]};
}

function zimoneRules(m){
  const out = [], b = m.board||{}, tl = m.timeline||[], plays = m.plays||[], uses = m.cmd_uses||[];
  const zim = (m.my_commanders||[])[0]; if(!zim || !/Zimone/.test(card(zim).name||'')) return out;
  const myTurns = tl.filter(t=>t.a==='me').map(t=>t.t), tn = {}; myTurns.forEach((t,i)=>tn[t]=i+1);
  const o = g => (card(g).oracle||'').toLowerCase(), nm = g => card(g).name;
  const grown = new Set(); uses.forEach(u=>(u.targets||[]).forEach(g=>grown.add(g)));
  const hasCounters = g => grown.has(g) || /enters with .*\+1\/\+1 counter|put (a|an|one|two|three|x) \+1\/\+1 counters? on (it|this|~)/.test(o(g));
  const lifeAt = (t,s) => ((tl.find(x=>x.t===t)||{})[s]||{}).life;
  const push = (t, verdict, rule, title, why, better, impact, g) => out.push({t, n:tn[t]??null, cat:'commander', verdict, rule, title, why, better, impact, g});
  const tracksAbilities = uses.some(u=>u.kind);
  for(const t of myTurns){
    const zStart = ((b[t-1]||{}).me||[]).some(p=>p[0]===zim && p[1]!=null);
    if(zStart){
      const post = plays.filter(p=>p.t===t && p.side==='me' && p.k==='spell' && p.ph==='Main2' && /Creature/.test(card(p.g).type||'') && p.g!==zim);
      if(post.length) push(t,'question','zim-postcombat',`Cast ${post.map(p=>nm(p.g)).slice(0,2).join(' and ')} after combat`,
        `Zimone's start-of-combat trigger puts a +1/+1 counter on up to two creatures. ${post.length>1?'These':'It'} came down after combat, so missed out.`,
        'With Zimone out, cast creatures in your first main phase unless you need to hold mana.', 2, post[0].g);
    }
    const end = b[t]; const z = end && (end.me||[]).find(p=>p[0]===zim);
    if(tracksAbilities && z && !z[3] && !z[6]){
      const open = (end.me||[]).filter(p=>p[4] && !p[3]), cols = landColours(open);
      const activated = uses.some(u=>u.t===t && u.kind==='activated');
      const targets = (end.me||[]).filter(p=>p[1]!=null && p[0]!==zim && hasCounters(p[0]));
      const instant = (end.hand||[]).some(g=>(/Instant/.test(card(g).type||'') || (card(g).kw||[]).includes('flash')) && (card(g).cmc||0)<=open.length);
      if(!activated && open.length>=2 && cols.has('G') && cols.has('U') && targets.length && !instant)
        push(t,'question','zim-double','Zimone\'s doubling went unused',
          `You ended the turn with ${open.length} lands untapped and Zimone untapped. {G}{U}, tap would have doubled the counters on ${targets.slice(0,2).map(p=>nm(p[0])).join(' and ')}.`,
          'Spare {G}{U} at the end of your turn is free growth, unless you\'re holding it for an instant.', 2, zim);
    }
    const heraldOut = ((b[t-1]||{}).me||[]).some(p=>/^Herald of Secret Streams/.test(nm(p[0])));
    if(heraldOut){
      const att = new Set((((m.combat||{})[t]||{}).att||[]).filter(a=>a[2]==='me').map(a=>a[0]));
      const pre = ((m.precombat||{})[t]||{}).me || [];
      const idle = pre.filter(p=>p[1]!=null && (p[1]||0)>=3 && !p[3] && !p[6] && hasCounters(p[0]) && !att.has(p[0]) && !(card(p[0]).kw||[]).includes('defender'));
      const oppPow = ((b[t-1]||{}).opp||[]).reduce((s,p)=>s+(p[1]||0),0), life = lifeAt(t-1,'me') ?? 25;
      if(idle.length && oppPow < life*0.5) push(t,'question','herald-idle','Unblockable damage left at home',
        `Herald of Secret Streams makes creatures with +1/+1 counters unblockable, but ${idle.slice(0,3).map(p=>nm(p[0])).join(', ')} (${idle.reduce((s,p)=>s+(p[1]||0),0)} power) didn't attack.`,
        'With Herald out, creatures with counters can attack freely unless you need them to block.', Math.min(8, Math.round(idle.reduce((s,p)=>s+(p[1]||0),0)/2)), idle[0][0]);
    }
  }
  return out;
}

function openManaRules(m){
  const out = [], b = m.board||{}, tl = m.timeline||[], plays = m.plays||[];
  const myTurns = tl.filter(t=>t.a==='me').map(t=>t.t), tn = {}; myTurns.forEach((t,i)=>tn[t]=i+1);
  const nm = g => card(g).name, blue = /U/.test(m.opp_colors||'');
  const cmdMine = new Set(m.my_commanders||[]);
  (m.countered||[]).filter(c=>c.side==='me' && c.by_side==='opp').forEach(c=>{
    const t = c.t; if(!tn[t]) return;
    const openOpp = ((b[t-1]||{}).opp||[]).filter(p=>p[4] && !p[3]).length;
    const otherCast = plays.filter(p=>p.t===t && p.side==='me' && p.k==='spell' && p.g!==c.g).length;
    const cost = (card(c.g).cmc||0) + (cmdMine.has(c.g) ? 2*plays.filter(p=>p.t<t && p.side==='me' && p.g===c.g && p.k==='spell').length : 0);
    const hand = ((b[t-1]||{}).hand||[]).filter(g=>!isLand(g) && g!==c.g && (card(g).cmc||0)>=1 && (card(g).cmc||0) < cost && !/target|enchant /i.test(card(g).oracle||'')
      && !/Instant/.test(card(g).type||'') && !(card(g).kw||[]).includes('flash'));
    if(otherCast || !hand.length) return;
    const bait = hand.sort((a,b2)=>(card(b2).cmc||0)-(card(a).cmc||0))[0];
    out.push({t, n:tn[t], cat:'interaction', verdict:'question', rule:'bait', title:`${nm(c.g)} ran into a counter`,
      why:`They had ${openOpp} land${openOpp===1?'':'s'} untapped${blue?' and play blue':''} and countered ${nm(c.g)}. You were also holding ${hand.slice(0,3).map(nm).join(', ')}.`,
      better:`Lead with ${nm(bait)} to draw the counter out, or cast ${nm(c.g)} on a turn they're tapped low.`, impact:cmdMine.has(c.g)?5:3, g:c.g});
  });
  if(blue){
    const counteredIds = new Set((m.countered||[]).filter(c=>c.side==='me').map(c=>c.t+':'+c.g));
    let n = 0;
    plays.filter(p=>p.side==='me' && p.k==='spell' && tn[p.t] && cmdMine.has(p.g) && !counteredIds.has(p.t+':'+p.g)).forEach(p=>{
      const openOpp = ((b[p.t-1]||{}).opp||[]).filter(q=>q[4] && !q[3]).length;
      if(openOpp<=1 && n<1){ n++; out.push({t:p.t, n:tn[p.t], cat:'interaction', verdict:'good', rule:'tapped-out-good', title:`Cast ${nm(p.g)} while they were tapped out`,
        why:`They had ${openOpp} land${openOpp===1?'':'s'} untapped, so a counterspell wasn't possible.`, better:'', impact:0, g:p.g}); }
    });
  }
  return out;
}

function threatRules(m, existing){
  const out = [], b = m.board||{}, T = D.threats||{}, plays = m.plays||[], tl = m.timeline||[];
  const tn = {}; tl.filter(t=>t.a==='me').forEach((t,i)=>tn[t.t]=i+1);
  const o = g => (card(g).oracle||'').toLowerCase(), nm = g => card(g).name;
  const remRe = /destroy target (nonland )?(creature|permanent)|exile target (nonland )?(creature|permanent)|damage equal to its power to (target|another target)|fights target|destroy target creature with flying/;
  const used = new Set();
  (m.removals||[]).filter(r=>r.side==='opp' && r.by_side==='me' && r.creature).forEach(r=>{
    if(existing.some(d=>d.rule==='removal-target' && d.t===r.t)) return;
    const spell = plays.find(p=>p.t===r.t && p.side==='me' && p.k==='spell' && remRe.test(o(p.g)) && !used.has(p)); if(!spell) return; used.add(spell);
    const score = g => (T[g]||[0,0]);
    const flyOnly = /with flying/.test(o(spell.g));
    const mine = score(r.g);
    const alts = ((b[r.t-1]||{}).opp||[]).filter(p=>p[1]!=null && p[0]!==r.g && (!flyOnly || (card(p[0]).kw||[]).includes('flying')))
      .map(p=>({g:p[0], s:score(p[0])})).filter(a=>a.s[1]>=3 && a.s[0] >= Math.max(6, 2*mine[0])).sort((a,b2)=>b2.s[0]-a.s[0]);
    if(alts.length) out.push({t:r.t, n:tn[r.t]??null, cat:'interaction', verdict:'question', rule:'threat-target', title:`Removal on ${nm(r.g)}`,
      why:`Across your games, ${nm(alts[0].g)} has averaged ${alts[0].s[0]} damage-and-kills per game it showed up in (${alts[0].s[1]} games), against ${mine[0]} for ${nm(r.g)}. It was on the board when you used ${nm(spell.g)}.`,
      better:`Unless ${nm(r.g)} was about to do something specific, save removal for ${nm(alts[0].g)}.`, impact:3, g:alts[0].g});
  });
  return out;
}

function keepFromData(m, d){
  const f = m.hand_f; if(!f) return d;
  const sim = M.filter(x=>x!==m && x.hand_f && x.hand_f.lands===f.lands && !!x.hand_f.ramp===!!f.ramp && (x.result==='Win'||x.result==='Loss'));
  const wl = winsLosses(sim), n = wl[0]+wl[1]; if(n<5) return d;
  const rate = wl[0]/n;
  const mw = winsLosses(M.filter(x=>x!==m && x.mulligans>=1 && (x.result==='Win'||x.result==='Loss')));
  d = {...d, why: d.why + ` Your record with ${f.lands}-land hands ${f.ramp?'with':'without'} ramp: ${wl[0]}–${wl[1]} (${Math.round(rate*100)}%)${mw[0]+mw[1]>=3?`, vs ${Math.round(100*mw[0]/(mw[0]+mw[1]))}% after a mulligan`:''}.`};
  if(rate<=0.35 && d.verdict!=='mistake') d.verdict = 'question';
  if(rate>=0.65 && (d.verdict==='ok' || d.verdict==='question')) d.verdict = 'good';
  return d;
}

function brain(m, {all=false}={}){
  if(m._brain && !all) return m._brain;
  let ds = decisions(m);
  ds = ds.concat(zimoneRules(m), openManaRules(m));
  ds = ds.concat(threatRules(m, ds));
  ds = ds.map(d=>{ d = {...d, rule: ruleOf(d)}; if(d.rule==='keep') d = keepFromData(m, d);
    const c = d.t ? wpCost(m, d.t) : null; if(c) d.wp = c; return d; });
  ds.forEach(d=>d.muted = isMuted(m, d));
  ds.sort((a,b)=>a.t-b.t);
  if(!all){ m._brain = ds; }
  return ds;
}
const live = ds => ds.filter(d=>!d.muted);
function keyMoment(m, ds){
  const cands = live(ds).filter(d=>d.verdict==='mistake'||d.verdict==='question');
  const sc = d => d.impact + (d.wp ? d.wp.drop*40 : 0) + (d.verdict==='mistake'?2:0);
  return cands.sort((a,b)=>sc(b)-sc(a))[0];
}
function swings(m){
  const w = m.wp||[]; const out = [];
  for(let i=1;i<w.length;i++) out.push({t:w[i][0], from:w[i-1][1], to:w[i][1], d:w[i][1]-w[i-1][1]});
  return out;
}
function swingText(m, s){
  const act = ((m.timeline||[]).find(x=>x.t===s.t)||{}).a;
  const theirs = (m.plays||[]).filter(p=>p.t===s.t && p.side==='opp' && p.k==='spell').map(p=>card(p.g).name);
  const mine = (m.plays||[]).filter(p=>p.t===s.t && p.side==='me' && p.k==='spell').map(p=>card(p.g).name);
  const died = (m.removals||[]).filter(r=>r.t===s.t && r.side==='me' && r.creature).map(r=>card(r.g).name);
  const lost = (m.removals||[]).filter(r=>r.t===s.t && r.side==='opp' && r.creature).map(r=>card(r.g).name);
  const bits = [];
  if(act==='opp' && theirs.length) bits.push(`they cast ${theirs.slice(0,3).join(', ')}`);
  if(act==='me' && mine.length) bits.push(`you cast ${mine.slice(0,3).join(', ')}`);
  if(died.length) bits.push(`you lost ${died.slice(0,3).join(', ')}${died.length>3?` and ${died.length-3} more`:''}`);
  if(lost.length) bits.push(`they lost ${lost.slice(0,3).join(', ')}`);
  return bits.join('; ');
}
const pc = p => Math.round(p*100)+'%';
function wpBlock(m){
  if(!(m.wp||[]).length) return '';
  const xs = m.wp.map(x=>x[0]);
  const chart = lineChart({title:'Your win chance, turn by turn', xs, series:[{name:'You', cls:'me', values:m.wp.map(x=>Math.round(x[1]*100))}], fmt:v=>v+'%'});
  const sw = swings(m), down = sw.filter(s=>s.d<0).sort((a,b)=>a.d-b.d)[0], up = sw.filter(s=>s.d>0).sort((a,b)=>b.d-a.d)[0];
  const line = (s, word) => s && Math.abs(s.d)>=0.08 ? `<div class="swing"><span class="small">${word} · T${s.t}</span><b>${pc(s.from)} → ${pc(s.to)}</b><p>${esc(swingText(m,s)||'Board and life totals shifted.')}</p></div>` : '';
  return `<div class="cols2 wpwrap">${chart}<div><h3 class="sub">Swing turns</h3>${line(down,'Biggest drop')}${line(up,'Biggest gain')}
    <div class="small" style="margin-top:8px">Win chance comes from a model trained on your own ${(D.winmodel||{}).games||''} games (life, board, cards, lands, commanders). It gets the winner right about two times in three mid-game, so read it as a trend, not a verdict.</div></div></div>`;
}

function decisionsHtml(m){
  if(!m.board) return '';
  const ds = brain(m), L = live(ds), s = decisionScore(L), muted = ds.filter(d=>d.muted);
  const key = keyMoment(m, ds);
  let h = `<h3 class="sec">Decisions <span class="small" style="text-transform:none;letter-spacing:0">· ${s.good} good, ${s.question} questionable, ${s.mistake} mistake${s.mistake===1?'':'s'}</span></h3>`;
  if(key) h += `<div class="keymoment" data-g="${key.g||''}"><span class="small">Key moment · ${key.t===0?'before the game':key.n?`your turn ${key.n} (T${key.t})`:`their turn (T${key.t})`}${key.wp&&key.wp.drop>=0.05?` · win chance ${pc(key.wp.from)} → ${pc(key.wp.to)}`:''}</span>
      <b>${esc(key.title)}</b><p>${esc(key.why)}</p>${key.better?`<p class="better"><span>Better:</span> ${esc(key.better)}</p>`:''}</div>`;
  else h += `<div class="keymoment good"><b>No clear mistakes found.</b><p>Every decision the tracker can judge from the board looked sound.</p></div>`;
  h += wpBlock(m);
  if(!L.length) return h;
  h += `<table class="plays decisions"><tbody>${L.map(d=>`<tr data-g="${d.g||''}"><td class="num" style="width:64px">${d.t?`T${d.t}`:'Hand'}</td>
    <td style="width:118px"><span class="badge" style="background:${DV[d.verdict][1]}">${DV[d.verdict][0]}</span></td>
    <td><b style="font-weight:550">${esc(d.title)}</b> <span class="small">· ${esc(DCAT[d.cat])}${d.wp&&Math.abs(d.wp.drop)>=0.05&&d.verdict!=='good'?` · win chance ${pc(d.wp.from)} → ${pc(d.wp.to)}`:''}</span><div style="margin-top:2px">${esc(d.why)}</div>
    ${d.better?`<div class="better"><span>Better:</span> ${esc(d.better)}</div>`:''}
    <div class="fbrow"><button class="dis" data-rule="${d.rule}" data-t="${d.t}">Disagree</button></div></td></tr>`).join('')}</tbody></table>`;
  if(muted.length) h += `<div class="small" style="margin-top:8px">${muted.length} hidden by your feedback: ${muted.map(d=>`${esc(d.title)} <a href="#" class="undo" data-rule="${d.rule}" data-t="${d.t}" data-kind="${FEEDBACK.some(f=>f.scope==='kind'&&f.key===d.rule)?1:0}">undo</a>`).join(' · ')}</div>`;
  h += `<div class="small" style="margin-top:8px">Judged from the board, your hand and the life totals after the game. It can't see their hand or instant-speed tricks, so treat "Questionable" as worth a second look. Use Disagree when it's wrong and it will learn.</div>`;
  return h;
}
function wireFeedback(root){
  root.addEventListener('click', async e=>{
    const m = M.find(x=>x.match_id===selected); if(!m) return;
    const dis = e.target.closest('.dis'), undo = e.target.closest('.undo'), save = e.target.closest('.fbsave'), cancel = e.target.closest('.fbcancel');
    if(dis){ const row = dis.parentElement; if(row.querySelector('.fbform')) return;
      row.insertAdjacentHTML('beforeend', `<div class="fbform"><input type="text" maxlength="300" placeholder="Why? (optional, e.g. I was holding up a counter)">
        <label><input type="radio" name="sc${dis.dataset.rule}${dis.dataset.t}" value="one" checked> Just this game</label>
        <label><input type="radio" name="sc${dis.dataset.rule}${dis.dataset.t}" value="kind"> Stop flagging "${esc(RULE_NAMES[dis.dataset.rule]||dis.dataset.rule)}"</label>
        <button class="fbsave" data-rule="${dis.dataset.rule}" data-t="${dis.dataset.t}">Save</button> <button class="fbcancel">Cancel</button></div>`); return; }
    if(cancel){ cancel.closest('.fbform').remove(); return; }
    if(save){ const f = save.closest('.fbform'), scope = f.querySelector('input[type=radio]:checked').value;
      const rule = save.dataset.rule, t = save.dataset.t;
      save.disabled = true;
      const ok = await sendFeedback({action:'add', match_id:m.match_id, scope, key: scope==='kind' ? rule : rule+'|'+t, reason:f.querySelector('input[type=text]').value});
      M.forEach(x=>delete x._brain); renderDetail();
      if(!ok) toast('Saved in this browser only. Open the dashboard from the tracker (Open Dashboard) to save it for good.');
      return; }
    if(undo){ e.preventDefault(); const kind = undo.dataset.kind==='1';
      await sendFeedback({action:'remove', match_id:m.match_id, scope: kind?'kind':'one', key: kind ? undo.dataset.rule : undo.dataset.rule+'|'+undo.dataset.t});
      M.forEach(x=>delete x._brain); renderDetail(); }
  });
}
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 5000); }

/* ---------- overview: what decides your games, feedback, tilt & trend ---------- */
function modelOverview(){
  const mdl = D.winmodel||{}; if(!mdl.beta) return '';
  const labels = D.wp_labels||{};
  const rows = mdl.features.map((f,i)=>({f, b:mdl.beta[i]})).filter(r=>r.f!=='base' && labels[r.f]).sort((a,b)=>Math.abs(b.b)-Math.abs(a.b));
  const mx = Math.max(...rows.map(r=>Math.abs(r.b)), 0.01);
  return simpleTable('What decides your games', ['Factor','Effect on your win chance',''], rows.map(r=>[esc(labels[r.f]),
    `<span class="effbar ${r.b>=0?'pos':'neg'}" style="width:${Math.round(70*Math.abs(r.b)/mx)+4}px"></span>`, r.b>=0?'helps':'hurts']),
    'Needs more games.') ;
}
function feedbackOverview(){
  const kinds = FEEDBACK.filter(f=>f.scope==='kind'), ones = FEEDBACK.filter(f=>f.scope==='one');
  if(!kinds.length && !ones.length) return '';
  return `<div class="panel"><h3>Your feedback</h3>
    ${kinds.length?`<p class="small">Switched off: ${kinds.map(f=>`${esc(RULE_NAMES[f.key]||f.key)} <a href="#" class="unmute" data-k="${esc(f.key)}">turn back on</a>`).join(' · ')}</p>`:''}
    ${ones.length?`<p class="small">${ones.length} individual call${ones.length===1?'':'s'} marked wrong${ones.filter(f=>f.reason).length?`. Reasons you gave: ${ones.filter(f=>f.reason).slice(-5).map(f=>'“'+esc(f.reason)+'”').join(', ')}`:''}.</p>`:''}</div>`;
}
function tiltOverview(){
  const ss = sessionsList(); if(ss.length<2) return '';
  const rows = [1,2,3,4].map(k=>{ const gs = ss.flatMap(s=>k<4 ? (s.games[k-1]?[s.games[k-1]]:[]) : s.games.slice(3)).filter(m=>m.board);
    const mis = gs.map(m=>live(brain(m)).filter(d=>d.verdict==='mistake').length); const wl = winsLosses(gs);
    return [k<4?`Game ${k}`:'Game 4+', String(gs.length), gs.length?(mis.reduce((a,b)=>a+b,0)/gs.length).toFixed(1):'–', `${wl[0]}–${wl[1]}`]; });
  const chrono = M.slice().reverse().filter(m=>m.board);
  const after = {Win:[], Loss:[]};
  chrono.forEach((m,i)=>{ const p = chrono[i-1]; if(p && after[p.result] && m.start - p.end < 45*60*1000) after[p.result].push(live(brain(m)).filter(d=>d.verdict==='mistake').length); });
  const avg = a => a.length ? (a.reduce((x,y)=>x+y,0)/a.length).toFixed(1) : '–';
  const per = chrono.map(m=>live(brain(m)).filter(d=>d.verdict==='mistake').length);
  const roll = per.map((_,i)=>{ const w = per.slice(Math.max(0,i-4), i+1); return +(w.reduce((a,b)=>a+b,0)/w.length).toFixed(2); });
  return simpleTable('Mistakes through a session', ['Game in session','Games','Mistakes per game','W–L'], rows)
    + simpleTable('After a win vs after a loss', ['Previous game','Mistakes in the next game'], [['Win', avg(after.Win)], ['Loss', avg(after.Loss)]])
    + `<div class="panel">${lineChart({title:'Mistakes per game (5-game average)', xs:chrono.map((_,i)=>i+1), series:[{name:'Mistakes', cls:'me', values:roll}], xLabel:'Game'})}</div>`;
}

/* ---------- matchups: a playbook per opponent style ---------- */
function playbookHtml(arch){
  const gs = M.filter(m=>archetype(m)===arch && (m.result==='Win'||m.result==='Loss') && m.board);
  if(gs.length<3) return `<div class="panel"><h3>Playbook vs ${esc(arch)}</h3><div class="empty">Needs at least 3 games against ${esc(arch)} decks.</div></div>`;
  return playbookFrom(gs, `Playbook vs ${esc(arch)} decks`);
}
function playbookFrom(gs, title){
  const wl = winsLosses(gs), facts = [];
  { let tot = 0, cmd = 0; gs.forEach(m=>{ const ids = new Set(m.opp_commanders||[]); Object.entries(m.damage?.opp?.to_player||{}).forEach(([g,v])=>{ tot += v; if(ids.has(+g)) cmd += v; }); });
    if(tot) facts.push(`Their commander dealt <b>${Math.round(100*cmd/tot)}%</b> of the damage you took.`); }
  const zimTurn = m => { const tn = (m.timeline||[]).filter(t=>t.a==='me').map(t=>t.t); const c = (m.plays||[]).find(p=>p.side==='me' && p.k==='spell' && (m.my_commanders||[]).includes(p.g)); return c ? tn.indexOf(c.t)+1 : null; };
  const early = gs.filter(m=>{ const z = zimTurn(m); return z && z<=4; }), late = gs.filter(m=>!early.includes(m));
  const a = winsLosses(early), b2 = winsLosses(late);
  facts.push(`Commander cast by your turn 4: <b>${a[0]}–${a[1]}</b>. Later or never: <b>${b2[0]}–${b2[1]}</b>.`);
  const wiped = gs.filter(m=>(m.removals||[]).filter(r=>r.side==='me' && r.creature && r.by_side==='opp').reduce((acc,r)=>{acc[r.t]=(acc[r.t]||0)+1; return acc;},{}) && Object.values((m.removals||[]).filter(r=>r.side==='me' && r.creature && r.by_side==='opp').reduce((acc,r)=>{acc[r.t]=(acc[r.t]||0)+1; return acc;},{})).some(n=>n>=3));
  if(wiped.length){ const w = winsLosses(wiped); facts.push(`They wiped your board in <b>${wiped.length} of ${gs.length}</b> games (you went ${w[0]}–${w[1]} in those). ${brainCount(gs,'wipe-tapped')?`You tapped out while holding a counter ${brainCount(gs,'wipe-tapped')} time${brainCount(gs,'wipe-tapped')===1?'':'s'}.`:''}`); }
  const ctr = gs.filter(m=>(m.countered||[]).some(c=>c.side==='me'));
  if(ctr.length){ const w = winsLosses(ctr); facts.push(`They countered your spells in <b>${ctr.length} of ${gs.length}</b> games (${w[0]}–${w[1]}).`); }
  const harm = {}; gs.forEach(m=>{ Object.entries(m.damage?.opp?.to_player||{}).forEach(([g,v])=>harm[g]=(harm[g]||0)+v);
    (m.removals||[]).filter(r=>r.side==='me' && r.by_side==='opp' && r.by).forEach(r=>harm[r.by]=(harm[r.by]||0)+4); });

  const mine = {}; gs.forEach(m=>new Set((m.plays||[]).filter(p=>p.side==='me' && p.k==='spell').map(p=>p.g)).forEach(g=>{ (mine[g] ||= [0,0])[m.result==='Win'?0:1]++; }));
  const rated = Object.entries(mine).filter(([,v])=>v[0]+v[1]>=3).map(([g,v])=>({g:+g, v, r:v[0]/(v[0]+v[1])})).sort((x,y)=>y.r-x.r);
  if(rated.length>=2 && wl[0] && wl[1]){ const best = rated.filter(x=>x.r>=0.6).slice(0,3), worst = rated.filter(x=>x.r<=0.4 && !best.includes(x)).slice(-2);

    if(worst.length) facts.push(`Weakest: ${worst.map(x=>`${link(x.g)} (${x.v[0]}–${x.v[1]})`).join(', ')}.`); }
  const lossRules = {}; gs.filter(m=>m.result==='Loss').forEach(m=>new Set(live(brain(m)).filter(d=>d.verdict==='mistake'||d.verdict==='question').map(d=>d.rule)).forEach(r=>lossRules[r]=(lossRules[r]||0)+1));
  const lr = Object.entries(lossRules).sort((x,y)=>y[1]-x[1]).slice(0,2);

  return `<div class="panel playbook"><h3>${title} <span class="small" style="text-transform:none;letter-spacing:0">· ${gs.length} games · ${wl[0]}–${wl[1]}</span></h3><ul>${facts.map(f=>`<li>${f}</li>`).join('')}</ul></div>`;

/* deck simulator */
function simDeck(deck, {n=4000, onPlay=true}={}){
  const zim = 4, res = {lands3:0, cmd4:0, cmd5:0, screw:0, flood:0, mana4:0};
  const info = deck.map(g=>({land:isLand(g), ramp:!isLand(g) && rolesOf(g).includes('ramp') && cmcOf(g)<=3, cmc:cmcOf(g)}));
  for(let it=0; it<n; it++){
    const idx = info.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
    let drawn = 7, lands = 0, bonus = 0, mana = 0; const hand = idx.slice(0,7);
    let landsInHand = hand.filter(i=>info[i].land).length, rampInHand = hand.filter(i=>info[i].ramp).map(i=>info[i]);
    let cmdTurn = null;
    for(let t=1; t<=6; t++){
      if(t>1 || !onPlay){ const c = info[idx[drawn++]]; if(c.land) landsInHand++; else if(c.ramp) rampInHand.push(c); }
      if(landsInHand>0){ lands++; landsInHand--; }
      mana = lands + bonus;
      if(t===3 && lands>=3) res.lands3++;
      if(cmdTurn==null && mana>=zim) cmdTurn = t;
      rampInHand.sort((a,b)=>a.cmc-b.cmc);
      if(rampInHand.length && rampInHand[0].cmc<=mana && (cmdTurn==null || cmdTurn>t)){ rampInHand.shift(); bonus++; }
      if(t===4){ if(lands<=2) res.screw++; res.mana4 += mana; }
    }
    if(cmdTurn!=null && cmdTurn<=4) res.cmd4++;
    if(cmdTurn!=null && cmdTurn<=5) res.cmd5++;
    const first12 = idx.slice(0,12).filter(i=>info[i].land).length; if(first12>=7) res.flood++;
  }
  return {lands3:res.lands3/n, cmd4:res.cmd4/n, cmd5:res.cmd5/n, screw:res.screw/n, flood:res.flood/n, mana4:res.mana4/n};
}

  return {class:RANKS[i], level:4-Math.floor(v - i*4), step:Math.round(((v - i*4) % 1)*6)}; }
function seasonHtml(){

    ${NN_PROFS.map(([k,l])=>`<button class="nn-pill" data-prof="${k}" style="cursor:pointer;${k===NN_PROF?'background:var(--fg);color:var(--bg)':'background:var(--sunk);color:var(--fg)'}">${l}</button>`).join('')}
    <span id="nn-sw-info" class="small" style="margin-left:6px"></span></div>`;
}
function nnBindSwitch(el){
  el.querySelectorAll('.nn-switch [data-prof]').forEach(b => b.onclick = () => {
    if(b.dataset.prof === NN_PROF) return;
    NN_PROF = b.dataset.prof; NN_HIST_SIG = ''; NN_LAST = null; el.innerHTML = ''; netFetch();
  });
}
function nnInfo(n){
  const pct = v => v==null ? '–' : (v*100).toFixed(1)+'%';
  const parts = [];
  if(n.acc!=null) parts.push(`right on ${pct(n.acc)} of unseen games`);
  if(n.games!=null) parts.push(`${n.games} real + ${(n.sim_games||0).toLocaleString()} simulated`);
  if(n.sim_total) parts.push(`simulator: ${n.sim_running||0} running, won ${pct(n.sim_wins/n.sim_total)} of ${n.sim_total.toLocaleString()}`);
  if(n.trained) parts.push(`trained ${n.trained}`);
  const o = n.optimiser;
  if(o && o.testing){ const t = o.testing, c = o.champion || {};
    parts.push(`optimiser: best list ${pct(c.wr)} (${(c.games||0).toLocaleString()} games) · testing ${t.swap} ${t.games}/${t.target} at ${pct(t.wr)} · ${o.tried} swaps tried, ${(o.promotions||[]).length} kept`); }
  return parts.join(' · ');
}
function netStop(){ if(NN_T){ clearInterval(NN_T); NN_T = null; } }
function netStart(){ netStop(); netFetch(); simFetch(); NN_T = setInterval(()=>{ if(!document.hidden){ netFetch(); simFetch(); } }, 2000); }
async function netFetch(){
  try{ const prof = NN_PROF; const r = await fetch(NET_API + '?profile=' + prof, {cache:'no-store'}); if(!r.ok) throw 0;
       const n = await r.json(); if(prof === NN_PROF) netRender(n); }
  catch(e){ if(!NN_LAST){ if(D.net && D.net.W1){ netRender(Object.assign({}, D.net, {source:(D.net.source||'')+' · tracker not running, so this is a saved copy'})); NN_LAST = null; }
    else { $('#tab-net').innerHTML = nnSwitchHtml() + `<div class="panel"><h3>Neural net</h3><p class="empty">Start the tracker to see the net.</p></div>`; nnBindSwitch($('#tab-net')); } } }
}
function nnRgb(name){ const t = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const m = t.match(/^#([0-9a-f]{6})$/i); return m ? [0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)) : [128,128,128]; }
function nnCol(v, pos, neg){ const a = Math.min(1, Math.abs(v)), c = nnRgb(v>=0 ? pos : neg), bg = nnRgb('--sunk');
  const k = 0.18 + a*0.82; return `rgb(${c.map((x,i)=>Math.round(x*k + bg[i]*(1-k))).join(',')})`; }
const NN_CARD = {permanents:'permanents',tokens:'tokens',artifacts:'artifacts',enchantments:'enchantments',planeswalkers:'planeswalkers',
  legendary:'legendaries',mana_value:'mana value on board',evasion:'evasive creatures',deathtouch:'deathtouch',lifelink:'lifelink',
  protected:'protected permanents',haste:'haste',strike:'first/double strike',evasive_power:'evasive power',mana:'mana sources',
  draw:'card-draw engines',counters:'+1/+1 counter cards',lock:'lock pieces',extra_turn:'extra-turn cards',drain:'life drain',
  removal:'removal',wipe:'wipe effects',doubler:'doublers',recursion:'graveyard recursion',anthem:'anthems'};
function nnLabel(f){
  if(NN_LABEL[f]) return NN_LABEL[f];
  const m = /^(my|opp)_(.+)$/.exec(f||''); if(!m) return f;
  const who = m[1]==='my' ? 'My' : 'Their', k = m[2];
  const t = /^text(\d+)$/.exec(k);
  return `${who} ${t ? 'card-text pattern '+t[1] : (NN_CARD[k]||k.replace(/_/g,' '))}`;
}
function netRender(n){
  const el = $('#tab-net');
  if(!n || !n.ready && !n.W1){
    const why = n&&n.error ? esc(n.error) : NN_PROF==='draft' ? `Not trained yet. Its simulator starts after your first draft, and it trains once 150 simulated games are in${n&&n.limited_games!=null?` (draft games recorded so far: ${n.limited_games})`:''}.`
      : NN_PROF==='goal' ? 'Not trained yet. It trains after 150 simulated games of your end-goal deck.' : 'Not trained yet. It needs 30 finished games.';
    el.innerHTML = nnSwitchHtml() + `<div class="panel"><h3>Neural net · ${NN_PROFS.find(p=>p[0]===NN_PROF)[1]}</h3><p class="empty">${why}</p>${n?`<p class="small">${esc(nnInfo(n))}</p>`:''}</div>`;
    nnBindSwitch(el); return; }
  NN_LAST = n;
  const MC = !!(n.classes && n.classes.length);
  const feats = n.feats || [], L = [feats.length, n.W1.length, n.W2.length, MC ? n.classes.length : 1];
  const CL = {win:'Win', they_conceded:'They concede', loss:'Loss', you_conceded:'You concede'};
  const B0 = feats.indexOf('my_permanents'), B = B0 > 0 ? B0 : Math.min(19, feats.length), C = feats.length - B, half = C/2;
  const top = 30, rowB = 24, rowC = 6.5, gap = C ? 44 : 0;
  const H = Math.round(top + B*rowB + gap + C*rowC + (C ? 30 : 10)), W = 960, xs = [190, 470, 680, 800];
  const yIn = i => i < B ? top + rowB*(i+0.5) : top + B*rowB + gap + rowC*(i-B+0.5) + (i-B >= half ? 14 : 0);
  const mid = H/2;
  const ys = L.map((k, l) => Array.from({length:k}, (_,i)=> { const sp = l===3 ? 46 : 30;
    return l===0 ? yIn(i) : k===1 ? mid : mid - Math.min(H*0.42, k*sp)/2 + Math.min(H*0.42, k*sp)*(i+0.5)/k; }));
  const act = [n.x ? n.x.map(v=>Math.max(-1,Math.min(1,v/2))) : feats.map(()=>0), n.h1 || n.W1.map(()=>0), n.h2 || n.W2.map(()=>0),
               MC ? (n.outv || n.classes.map(()=>0)).map((v,i)=> (i<2?1:-1) * Math.min(1, v*1.6)) : [n.p!=null ? (n.p-0.5)*2 : 0]];
  const mats = [n.W1, n.W2, MC ? n.W3 : [n.W3]];
  const live = n.x != null;
  let edges = '';
  mats.forEach((M, l) => {
    const mx = Math.max(...M.flat().map(Math.abs)) || 1;
    M.forEach((row, j) => row.forEach((w, i) => {
      const a = Math.abs(w)/mx, flow = live ? (0.25 + 0.75*Math.abs(act[l][i])) : 0.6;
      if(l===0 && i>=B && a < 0.25) return;  // keep the card-knowledge fan readable
      edges += `<line x1="${xs[l]}" y1="${ys[l][i].toFixed(1)}" x2="${xs[l+1]}" y2="${ys[l+1][j].toFixed(1)}" stroke="${w>=0?'var(--win)':'var(--loss)'}" stroke-opacity="${(0.06+0.6*a*flow).toFixed(3)}" stroke-width="${(0.5+2.4*a).toFixed(2)}"/>`;
    }));
  });
  let nodes = '';
  L.forEach((k, l) => ys[l].forEach((y, i) => {
    const v = act[l][i], r = l===3 ? (MC ? 13 : 30) : l===0 ? (i<B ? 6.5 : 2.8) : 9;
    nodes += `<circle cx="${xs[l]}" cy="${y.toFixed(1)}" r="${r}" style="fill:${l===3 ? nnCol(v,'--win','--loss') : nnCol(v,'--me','--opp')}!important;stroke:var(--faint)!important;stroke-width:${l===0&&i>=B?0.5:1}"><title>${l===0?esc(nnLabel(feats[i])):l===3?(MC?CL[n.classes[i]]:'Win chance'):'Hidden neuron '+(i+1)}: ${l===3?(MC?(n.outv?Math.round(n.outv[i]*100)+'%':'–'):(n.p!=null?Math.round(n.p*100)+'%':'–')):v.toFixed(2)}</title></circle>`;
    if(l===3 && MC){ nodes += `<text x="${xs[3]+22}" y="${(y+4).toFixed(1)}" style="fill:var(--fg)">${CL[n.classes[i]]}</text><text class="val" x="${xs[3]+22}" y="${(y+19).toFixed(1)}">${n.outv?Math.round(n.outv[i]*100)+'%':'–'}</text>`; }

      if(raw!=null) nodes += `<text class="val" x="${xs[0]-150}" y="${(y+4).toFixed(1)}" text-anchor="end">${feats[i]==='on_play'||feats[i].endsWith('_cmd')?(raw?'yes':'no'):Math.round(raw)}</text>`; }

    nodes += `<text x="${xs[0]-16}" y="${(g2+rowC*half/2).toFixed(1)}" text-anchor="end">Their cards · ${half}</text>`;
    nodes += `<text class="val" x="${xs[0]-16}" y="${(g1+rowC*half/2+16).toFixed(1)}" text-anchor="end">types, keywords, roles, text</text>`;

  else {
    nodes += `<text class="out" x="${xs[3]}" y="${mid+7}" text-anchor="middle">${n.p!=null?Math.round(n.p*100)+'%':'–'}</text>`;
    nodes += `<text x="${xs[3]}" y="${mid+52}" text-anchor="middle">win chance</text>`; }
  ['','Hidden layer 1','Hidden layer 2','Output'].forEach((t,l)=> nodes += `<text x="${xs[l]}" y="14" text-anchor="middle" style="fill:var(--faint);font-size:11px">${t}</text>`);
  const cls = n.training ? 'nn-train' : live && /^Live/.test(n.source||'') ? 'nn-flow' : '';
  const status = n.training ? `<span class="nn-pill"><span class="nn-dot train"></span>Training now · ${n.training_secs}s</span>`
    : /^Live/.test(n.source||'') ? `<span class="nn-pill"><span class="nn-dot live"></span>${esc(n.source)}</span>`
    : `<span class="nn-pill"><span class="nn-dot"></span>${esc(n.source||'Idle')}</span>`;
  let bars = '';
  if(n.sens){ const order = n.sens.map((v,i)=>[v,i]).filter(x=>Math.abs(x[0])>=0.005).sort((a,b)=>Math.abs(b[0])-Math.abs(a[0])).slice(0,8);
    const mx = Math.max(0.05, ...order.map(o=>Math.abs(o[0])));
    bars = order.map(([v,i])=>`<div class="nn-bar"><span>${esc(nnLabel(feats[i]))}</span><span class="t"><i style="background:${v>=0?'var(--win)':'var(--loss)'};left:${v>=0?50:50-50*Math.abs(v)/mx}%;width:${50*Math.abs(v)/mx}%"></i></span><span class="small num" style="text-align:right">${v>=0?'+':'−'}${Math.abs(Math.round(v*100))}%</span></div>`).join('')
      || '<p class="small">Nothing stands out: this board looks average to it.</p>'; }
  const h = n.history || [], tr = n.tried || {};
  const pct = v => v!=null ? Math.round(v*100)+'%' : '–';
  const ends = MC && n.outv ? `<div style="margin:12px 0 4px">${n.classes.map((c,i)=>`<div class="nn-bar"><span>${CL[c]}</span><span class="t"><i style="background:${i<2?'var(--win)':'var(--loss)'};left:0;width:${Math.round(n.outv[i]*100)}%"></i></span><span class="small num" style="text-align:right">${Math.round(n.outv[i]*100)}%</span></div>`).join('')}</div>` : '';
  const side = `<div class="panel"><h3>Right now</h3>${status}${ends}
      <p class="small" style="margin-top:12px">What pushes its guess up or down, compared with an average board from your games:</p>${bars||'<p class="small">Waiting for a board to look at.</p>'}</div>
    <div class="panel"><h3>The model</h3>
      <p class="small">${feats.length} inputs → ${n.W1.length} → ${n.W2.length} → ${MC ? n.classes.length+' ways the game can end (win, they concede, loss, you concede); win chance is the first two added together' : '1'}. ${C ? 'Besides the board numbers it knows what the cards are: types, keywords, roles like removal, lock pieces or extra turns, and a fingerprint of their rules text. ' : ''}Each time it retrains it tries board-only and with-card-knowledge versions and keeps whichever predicts your unseen games better. Green lines push towards a win, red towards a loss. Dots: purple is above your average board, pink below.</p>
      <table><tbody>

        <tr><td>Right on your unseen games</td><td class="num">${pct(n.acc)}</td></tr>
        ${n.ending_acc!=null?`<tr><td>Calls how they end (win, loss, or a concede)</td><td class="num">${pct(n.ending_acc)}</td></tr>`:''}

        <tr><td>Using</td><td class="num">${(n.fv||1)>=3?'Cards + timing':(n.fv||1)>=2?'Card knowledge':'Board only'}</td></tr>

      <div id="nn-hist"></div></div>
    ${n.replays && n.replays.cards && n.replays.cards.length ? `<div class="panel"><h3>What the replays taught it</h3>

/* ---------- replays of your real positions ---------- */
function replayHtml(m){
  const rows = (D.replays||{})[m.match_id]; if(!rows || !rows.length) return '';
  const pct = v => Math.round(v*100)+'%';
  const body = rows.map(r=>{
    const base = r.opts.find(o=>o.opt==='base');
    const others = r.opts.filter(o=>o.opt!=='base').map(o=>{
      const [kind, card] = o.opt.split(':');
      const d = base ? o.p - base.p : 0;
      const label = kind==='without' ? `Without ${esc(card)}` : `Cast ${esc(card)} straight away`;
      const verdict = kind==='without' ? (d < -0.05 ? `${esc(card)} mattered` : d > 0.05 ? `you did better without it` : 'made little difference')
                                       : (d > 0.05 ? 'using it at once was better' : d < -0.05 ? 'better kept for later' : 'timing made little difference');
      return `<tr><td>${label}</td><td class="num">${pct(o.p)}</td><td class="num" style="color:${d>0.02?'var(--win)':d<-0.02?'var(--loss)':'var(--muted)'}">${d>=0?'+':'−'}${Math.abs(Math.round(d*100))}%</td><td class="small">${verdict}</td></tr>`; }).join('');
    return `<tr><td colspan="4" style="padding-top:12px"><b>Turn ${r.t}</b> <span class="small">· as it stood, the AI playing your hand: ${base?pct(base.p):'–'} (${base?base.n:0} replays)</span></td></tr>${others}`;
  }).join('');
  return `<div class="panel"><h3>Replays of this game</h3><p class="small">Forge set up the real board and your real hand at the start of these turns and played on many times: as it was, without a card, and casting a removal spell straight away. Few replays each, so treat single numbers loosely; the patterns across many games are what the net learns from.</p><table><tbody>${body}</tbody></table></div>`;
}
/* ---------- watching the simulated games ---------- */
function simSide(sd, label){
  if(!sd) return '';

  const chips = perms.filter(p=>!p[4]).map(p=>{
    const pt = p[1]!=null ? ` <b>${p[1]}/${p[2]}</b>` : '';
    return `<span class="sim-chip${p[6]?' cmd':''}${p[3]?' tap':''}${p[5]?' tok':''}">${esc(p[0])}${pt}</span>`; }).join('');
  return `<div class="sim-side"><div class="sim-h"><span>${label}</span><span class="num">${sd.life} life · ${sd.hand} in hand · ${lands} lands · ${sd.lib} in library</span></div><div class="sim-chips">${chips||'<span class="small">nothing yet</span>'}</div></div>`;
}

    ${live.length ? live.map(g => g.replay ? `<div class="sim-game"><div class="sim-top"><b>Instance ${g.slot}</b><span class="small">Replaying a real position (${esc(g.replay)}) vs ${nm(g.opp_deck)}</span></div></div>` : g.starting ? `<div class="sim-game"><div class="sim-top"><b>Instance ${g.slot}</b><span class="small">You vs ${nm(g.opp_deck)} · starting Forge…</span></div></div>` :
      `<div class="sim-game"><div class="sim-top"><b>Instance ${g.slot}</b><span class="small">You vs ${nm(g.opp_deck)} · game ${g.game} of 4 · turn ${g.turn} · ${g.active==='me'?'your turn':'their turn'}</span></div>
        ${simSide(g.state && g.state.opp, 'Them')}${simSide(g.state && g.state.me, 'You')}
        <div class="sim-log">${(g.log||[]).slice(0,6).map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>`).join('')
      : `<p class="small">Nothing running. Pick a number of instances in the Simulator panel and press Start.</p>`}
    ${recent.length ? `<p class="small" style="margin-top:14px">Just finished</p><table><tbody>${recent.map(r=>`<tr><td>vs ${nm(r.opp)}</td><td>${r.turns} turns · ${((r.ms||0)/1000).toFixed(1)}s</td><td class="num" style="color:${r.result==='Win'?'var(--win)':r.result==='Loss'?'var(--loss)':'var(--muted)'}">${esc(r.result||'')}</td></tr>`).join('')}</tbody></table>` : ''}`;
}
/* ---------- simulator controls ---------- */
const SIM_API = location.protocol.startsWith('http') ? '/api/sim' : 'http://127.0.0.1:8766/api/sim';
let SIM_LAST = null;
async function simFetch(body){
  try{
    const r = await fetch(SIM_API, body ? {method:'POST', body:JSON.stringify(body), headers:{'Content-Type':'text/plain'}} : {cache:'no-store'});
    if(r.ok){ SIM_LAST = await r.json(); simRender(SIM_LAST); }
  }catch(e){}
}
function simRender(s){

  if(!el.dataset.ready){
    el.dataset.ready = '1';

      <p class="small">Forge plays your deck against the decks you meet on the ladder, AI against AI, and every game teaches the net. It pauses while you're in a game. Each instance uses about one CPU core and 1–1.5 GB of memory.</p>
      <div style="display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap">
        <label class="small" for="sim-n">Instances</label>
        <input id="sim-n" type="number" min="1" max="32" style="width:64px;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--fg)">
        <button id="sim-start" class="nn-pill" style="cursor:pointer;background:var(--sunk);color:var(--fg)">Start</button>
        <button id="sim-stop" class="nn-pill" style="cursor:pointer;background:var(--sunk);color:var(--fg)">Stop</button>
        <button id="sim-train" class="nn-pill" style="cursor:pointer;background:var(--sunk);color:var(--fg)">Retrain now</button>
      </div>
      <div id="sim-status"></div>`;
    el.querySelector('#sim-n').value = s.instances_setting || 4;
    el.querySelector('#sim-start').onclick = ()=> simFetch({action:'start', instances: +el.querySelector('#sim-n').value || 4});
    el.querySelector('#sim-stop').onclick = ()=> simFetch({action:'stop'});
    el.querySelector('#sim-train').onclick = ()=> simFetch({action:'retrain'});
  }
  if(s.error){ el.querySelector('#sim-status').innerHTML = `<p class="small">${esc(s.error)}</p>`; return; }

/* wildcard planner + craft suggestions */
const RAR = {common:'Common', uncommon:'Uncommon', rare:'Rare', mythic:'Mythic'};
function plannerHtml(){
  const up = D.upgrades || {stages:[]}, wc = (D.wildcards||[]).slice(-1)[0] || {};
  const left = up.stages.flatMap(st=>st.cards.filter(c=>!(st.done||[]).includes(c) && !(st.owned||[]).includes(c)).map(c=>({c, st:st.name})));
  if(!left.length) return '';
  const rar = c => { const u = (D.upgrade_cards||{})[c]||{}; return u.arena_rarity || u.rarity || ''; };
  const banned = left.filter(x=>((D.upgrade_cards||{})[x.c]||{}).brawl==='banned' || rar(x.c)==='not on Arena');
  const need = {common:0, uncommon:0, rare:0, mythic:0}; left.forEach(x=>{ if(need[rar(x.c)]!=null) need[rar(x.c)]++; });
  const have = {common:wc.c||0, uncommon:wc.u||0, rare:wc.r||0, mythic:wc.m||0};
  let pool = {...have}; const now = [], later = [];
  left.filter(x=>!banned.includes(x)).forEach(x=>{ const r = rar(x.c); if(r && pool[r]>0){ pool[r]--; now.push(x); } else later.push(x); });
  const short = {rare: Math.max(0, need.rare-have.rare), mythic: Math.max(0, need.mythic-have.mythic)};
  const packs = Math.max(Math.ceil(short.rare/0.21), Math.ceil(short.mythic/0.075));
  const gold = wc.gold||0;
  return `<div class="panel"><h3>Wildcard planner</h3>
    <table><thead><tr><th>Rarity</th><th class="num">Needed</th><th class="num">You have</th></tr></thead><tbody>
    ${Object.keys(need).filter(k=>need[k]).map(k=>`<tr><td>${RAR[k]}</td><td class="num">${need[k]}</td><td class="num" style="color:${have[k]>=need[k]?'var(--win)':'inherit'}">${have[k]}</td></tr>`).join('')}</tbody></table>
    ${banned.length?`<p style="color:var(--loss)"><b>Not playable:</b> ${banned.map(x=>esc(x.c)).join(', ')} (banned in Brawl or not on Arena). Remove from upgrades.json.</p>`:''}
    <p><b>Craft now:</b> ${now.length ? now.map(x=>upName(x.c)).join(', ') : 'nothing on the plan yet. Save up.'}</p>
    ${later.length ? `<p><b>Next:</b> ${later.slice(0,4).map(x=>`${upName(x.c)} <span class="small">(${RAR[rar(x.c)]||'?'})</span>`).join(', ')}</p>` : ''}
    ${packs ? `<p>To cover the rest you'd need roughly <b>${packs} packs</b> (about 1 rare wildcard per 5 packs and 1 mythic per 13, counting the wildcard track and in-pack wildcards). You have ${gold.toLocaleString()} gold, which is ${Math.floor(gold/1000)} pack${Math.floor(gold/1000)===1?'':'s'}.</p>` : ''}
    <p class="small">Rarity comes from Scryfall. Some cards have a cheaper printing on Arena, so check before crafting.</p></div>`;
}
function craftHtml(){
  const cr = D.craft || {}; if(!(cr.groups||[]).length) return '';
  return `<div class="panel"><h3>Answers to what beats you <span class="small" style="text-transform:none;letter-spacing:0">· from your last ${cr.losses} losses</span></h3>
    ${cr.groups.map(g=>`<div class="craftg"><b>${esc(g.label)}</b> <span class="small">· a big factor in ${g.losses} loss${g.losses===1?'':'es'}</span>
      <div class="gallery">${g.cards.map(c=>`<figure title="${esc(c.oracle||'')}">${c.img?`<a href="${esc(c.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(c.img)}" alt="${esc(c.name)}"></a>`:`<div class="tile">${esc(c.name)}</div>`}
        <span class="t" style="background:${c.rarity==='mythic'?'var(--loss)':c.rarity==='rare'?'var(--draw)':'var(--muted)'}">${esc(RAR[c.rarity]||c.rarity||'')}</span></figure>`).join('')}</div></div>`).join('')}

}
