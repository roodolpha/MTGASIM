[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtgasim"
version = "0.3.0"
description = "Simulate your MTG Arena decks against a gauntlet using Forge's AI"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mtgasim = "mtgasim.cli:main"

[tool.setuptools]
packages = ["mtgasim"]

[tool.setuptools.package-data]
mtgasim = ["harness/*.jar", "web/*.html"]
