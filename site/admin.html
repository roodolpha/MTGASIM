<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Brewbench admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--bg:#0B0C0E;--panel:#111317;--line:#22262D;--line2:#2C313A;--text:#E6E8EB;--dim:#8A919B;--hot:#FF6B3D;--sim:#6CB6FF;--bad:#F0605A;--ok:#3FB950}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;font-feature-settings:"tnum" 1}
h1,h2,b.n{margin:0;letter-spacing:-.01em;font-weight:600}
a{color:var(--hot)}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px 64px}
main{display:flex;flex-direction:column;gap:24px}
header{display:flex;align-items:center;gap:16px;padding:16px 0;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;letter-spacing:-.02em}
.logo span{color:var(--hot)} .logo small{font:600 14px system-ui,sans-serif;color:var(--dim);margin-left:8px;letter-spacing:0}
.right{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{height:34px;padding:0 14px;border:1px solid var(--hot);border-radius:6px;background:var(--hot);color:#170A04;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.btn.ghost{background:#161920;border-color:var(--line2);color:var(--text);font-weight:500}
.btn.small{height:28px;padding:0 10px;font-size:12px}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
input{background:var(--bg);border:1px solid var(--line2);border-radius:6px;color:var(--text);font:14px Inter,system-ui,sans-serif;padding:0 10px;height:34px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;min-width:0}
.panel h2{font-size:15px;margin-bottom:12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head h2{margin:0}
.strip{display:flex;flex-wrap:wrap;gap:10px 40px;align-items:baseline}
.strip b.n{font-size:22px;margin-right:6px}
.strip span{color:var(--dim);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px;align-items:start}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:8px}
.bars i{flex:1;background:var(--sim);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.axis{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--dim);text-align:left;font-weight:500;padding:6px 8px;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.dim{color:var(--dim)} .tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:700;border:1px solid var(--line)}
.tag.pub{color:var(--ok);border-color:var(--ok)} .tag.hid{color:var(--bad);border-color:var(--bad)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.login{min-height:70vh;display:grid;place-items:center}
.login form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:14px;width:min(100%,400px)}
.login h1{font-size:20px}
.err{color:var(--bad);min-height:1.5em;margin:0}
code{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">brew<span>bench</span><small>admin</small></div><div class="right" id="hdr"></div></header>
<main id="main"></main>
</div>
<script>
const API = (window.Brewbench_API || "").replace(/\/$/, "");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = (x) => Number(x || 0).toLocaleString();
const pct = (w, g) => (g ? Math.round((100 * (w || 0)) / g) + "%" : "–");
const when = (ms) => (ms ? new Date(ms).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "–");
let TOKEN = "";
try { TOKEN = sessionStorage.getItem("bb_admin") || ""; } catch (e) {}

async function call(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { Authorization: "Bearer " + TOKEN, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (r.status === 401) { signOut("That password didn't work."); throw new Error("unauthorised"); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || "HTTP " + r.status);
  return body;
}

function signOut(msg) {
  TOKEN = "";
  try { sessionStorage.removeItem("bb_admin"); } catch (e) {}
  login(msg);
}

function login(msg = "") {
  $("#hdr").innerHTML = "";
  $("#main").innerHTML = `<div class="login"><form id="lf" autocomplete="off">
    <h1>Admin</h1><label class="dim" for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required minlength="20">
    <p class="err" id="lerr" role="alert">${esc(msg)}</p>
    <button class="btn" type="submit">Unlock</button></form></div>`;
  $("#pw").focus();
  $("#lf").onsubmit = async (e) => {
    e.preventDefault();
    TOKEN = $("#pw").value.trim();
    try { await call("/v1/admin/stats"); try { sessionStorage.setItem("bb_admin", TOKEN); } catch (e) {} dash(); }
    catch (err) { if (err.message !== "unauthorised") $("#lerr").textContent = "Couldn't reach the API: " + err.message; }
  };
}

let Q = "";
async function dash() {
  $("#hdr").innerHTML = `<button class="btn ghost small" id="refresh">Refresh</button><button class="btn ghost small" id="out">Sign out</button>`;
  $("#out").onclick = () => signOut("");
  $("#refresh").onclick = dash;
  const [st, cl, sus, cr] = await Promise.all([call("/v1/admin/stats"), call("/v1/admin/clients?q=" + encodeURIComponent(Q)), call("/v1/admin/suspicious"),
    call("/v1/admin/crashes").catch(() => ({ crashes: [] }))]);
  const days = st.last_30_days || [], max = Math.max(1, ...days.map((d) => d.games));
  $("#main").innerHTML = `
  <section class="panel"><div class="strip">
    <div><b class="n">${n(st.uploaders)}</b><span>uploaders</span></div>
    <div><b class="n">${n(st.public)}</b><span>public</span></div>
    <div><b class="n">${n(st.active_7d)}</b><span>active this week</span></div>
    <div><b class="n">${n(st.games)}</b><span>real games (${pct(st.wins, st.games)} won)</span></div>
    <div><b class="n" style="color:var(--sim)">${n(st.sim_games)}</b><span>simulated games</span></div>
    <div><b class="n">${n(st.shared_lists)}</b><span>shared lists</span></div>
    ${st.hidden ? `<div><b class="n" style="color:var(--bad)">${n(st.hidden)}</b><span>hidden</span></div>` : ""}
  </div></section>
  <div class="grid">
    <section class="panel"><h2>Real games, last 30 days</h2>
      ${days.length ? `<div class="bars" aria-label="Games per day">${days.map((d) => `<i style="height:${Math.round((100 * d.games) / max)}%" title="${esc(d.day)}: ${d.games} games"></i>`).join("")}</div>
      <div class="axis"><span>${esc(days[0].day)}</span><span>${esc(days[days.length - 1].day)}</span></div>` : '<p class="dim">Nothing uploaded yet.</p>'}
    </section>
    <section class="panel"><h2>By format</h2>
      ${(st.by_format || []).length ? `<table><tbody>${st.by_format.map((f) => `<tr><td>${esc(f.format)}</td><td class="n">${n(f.games)}</td></tr>`).join("")}</tbody></table>` : '<p class="dim">Nothing yet.</p>'}
    </section>
  </div>
  <section class="panel"><div class="head"><h2>Uploaders</h2>
    <form id="sf" style="display:flex;gap:8px"><input id="q" placeholder="Search name or id" value="${esc(Q)}" aria-label="Search uploaders"><button class="btn ghost small" type="submit">Search</button></form></div>
    <div class="scroll"><table><thead><tr><th>Name</th><th>Status</th><th class="n">Games</th><th class="n">Won</th><th>Joined</th><th>Last upload</th><th></th></tr></thead><tbody>
    ${(cl.clients || []).map((c) => row(c)).join("") || '<tr><td colspan="7" class="dim">No one yet.</td></tr>'}
    </tbody></table></div></section>
  <section class="panel"><h2>Suspicious</h2>
    <p class="dim" style="margin:-6px 0 10px">At least ${st.suspicious_rule.minGames} games and over ${Math.round(st.suspicious_rule.winRate * 100)}% won. They're already kept off leaderboards; hide them to take them off every public page.</p>
    <div class="scroll"><table><thead><tr><th>Name</th><th class="n">Games</th><th class="n">Won</th><th class="n">Busiest day</th><th></th></tr></thead><tbody>
    ${(sus.suspicious || []).map((c) => `<tr><td>${nameCell(c)}</td><td class="n">${n(c.games)}</td><td class="n">${pct(c.wins, c.games)}</td><td class="n">${n(c.busiest_day)}</td>
      <td><div class="acts"><button class="btn ghost small" data-hide="${esc(c.id)}" data-v="1">Hide</button></div></td></tr>`).join("") || '<tr><td colspan="5" class="dim">Nothing suspicious.</td></tr>'}
    </tbody></table></div></section>`;
  $("#main").insertAdjacentHTML("beforeend", `<section class="panel"><div class="head"><h2>Crash reports</h2>${(cr.crashes || []).length ? '<button class="btn ghost small" id="crclear">Clear all</button>' : ""}</div>
    <p class="dim" style="margin:-6px 0 10px">From people who turned on crash reports in the app. Grouped by problem; newest first.</p>
    <div class="scroll"><table><thead><tr><th>Problem</th><th>Where</th><th class="n">Times</th><th class="n">Installs</th><th>Version</th><th>Last seen</th></tr></thead><tbody>
    ${(cr.crashes || []).map((c) => `<tr><td><details><summary>${esc(c.message)}</summary><pre style="white-space:pre-wrap;font-size:12px;color:var(--dim);margin:8px 0 0">${esc(c.trace || "")}</pre></details></td>
      <td class="dim">${esc(c.place || "")}</td><td class="n">${n(c.count)}</td><td class="n">${n(c.installs)}</td><td class="dim">${esc(c.version || "")}<div style="font-size:12px">${esc(c.os || "")}</div></td><td class="dim">${when(c.last_seen)}</td></tr>`).join("") || '<tr><td colspan="6" class="dim">No crash reports.</td></tr>'}
    </tbody></table></div></section>`);
  const crc = $("#crclear");
  if (crc) crc.onclick = async () => { if (!confirm("Clear all crash reports?")) return; await call("/v1/admin/crashes", { method: "DELETE" }); dash(); };
  $("#sf").onsubmit = (e) => { e.preventDefault(); Q = $("#q").value.trim(); dash(); };
  document.querySelectorAll("[data-hide]").forEach((b) => (b.onclick = async () => {
    b.disabled = true;
    await call("/v1/admin/hide", { method: "POST", body: JSON.stringify({ client_id: b.dataset.hide, hidden: b.dataset.v === "1" }) });
    dash();
  }));
  document.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => {
    if (!confirm(`Delete ${b.dataset.name} and everything they've uploaded? This can't be undone.`)) return;
    b.disabled = true;
    await call("/v1/admin/client", { method: "DELETE", body: JSON.stringify({ client_id: b.dataset.del }) });
    dash();
  }));
}

const nameCell = (c) => c.display_name ? `<b>${esc(c.display_name)}</b>` : `<span class="dim">anonymous</span> <code>${esc(String(c.id).slice(0, 8))}</code>`;
function row(c) {
  const label = c.display_name || "anonymous " + String(c.id).slice(0, 8);
  return `<tr><td>${nameCell(c)}</td>
    <td>${c.hidden ? '<span class="tag hid">hidden</span>' : c.public ? '<span class="tag pub">public</span>' : '<span class="tag">private</span>'}</td>
    <td class="n">${n(c.games)}</td><td class="n">${pct(c.wins, c.games)}</td>
    <td class="dim">${when(c.created)}</td><td class="dim">${when(c.last_upload)}</td>
    <td><div class="acts">
      <button class="btn ghost small" data-hide="${esc(c.id)}" data-v="${c.hidden ? "0" : "1"}">${c.hidden ? "Unhide" : "Hide"}</button>
      <button class="btn danger small" data-del="${esc(c.id)}" data-name="${esc(label)}">Delete</button></div></td></tr>`;
}

window.addEventListener("unhandledrejection", (e) => {
  if (e.reason && e.reason.message !== "unauthorised") alert("Something went wrong: " + e.reason.message);
});
TOKEN ? dash() : login();
</script>
</body>
</html>
